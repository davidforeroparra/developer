<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#551E1B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="moonTripMesure">
  <title>moonTripMesure · Recorder de polígonos · Polygon recorder</title>
  <!-- Tipografía VT323 + fallback monospace del sistema · sin Google Fonts (autocontenido).
       F-05 cosmético: si el navegador no resuelve 'VT323' cae a 'monospace'; las métricas
       son comparables (ambas monoespaciadas chunky). Sin llamadas de red para fuente. -->
  <!-- Leaflet 1.9.4 · CSS aquí · JS al final del head con defer (R-02/R-03 · best practice testersUrl) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    /* ============================================================
       SHELL · variables + reglas mínimas para que renderice topbar
       Las reglas específicas del recorder (.recorder-*, .poly-*),
       bandeja (.predio-card) y dialogos (.confirm-*) llegan en M-02.
       ============================================================ */
    /* Paleta MOON TRIP PIXEL ART BRANDED · decisión developer 20260513 (F-05 moonTripMesure fork cosmético)
       Variables conservan sus nombres heredados (--navy, --green, etc.) por modificación
       quirúrgica RD-07 § spec; los hex se remapean al gradiente moonTrip de
       paletaBrandingMoon.json: amarilloLuna · vinotinto · naranjaClaro · naranjaProfundo ·
       rojoOtonal · grisCarbon · blancoNeutro. Matriz §9.1 del spec. */
    :root {
      /* Alias semánticos Moon Trip (legibilidad del CSS) — Wave 2 F-05 */
      --amarilloLuna:    #F7F3A1;
      --naranjaClaro:    #E39F43;
      --naranjaProfundo: #A1602A;
      --rojoOtonal:      #9B1B18;
      --vinotinto:       #551E1B;
      --grisCarbon:      #272B2E;
      --blancoNeutro:    #F0F0F0;

      /* Variables heredadas del padre · nombres preservados · hex remapeados a Moon Trip */
      --navy:        #551E1B;             /* primario · vinotinto (era #6b1d2a vino tinto otoñal) */
      --green:       #E39F43;             /* acento principal · naranjaClaro (era #d2691e naranja quemado) */
      --green-dark:  #A1602A;             /* hover/darker · naranjaProfundo (era #a85816) */
      --blue:        #F7F3A1;             /* secundario · amarilloLuna (era #d4a017 amarillo dorado) */
      --orange:      #E39F43;             /* acento naranja · idem green (RD-07) */
      --offwhite:    #F7F3A1;             /* fondo principal · amarilloLuna (era #fbf3df pergamino) */
      --white:       #F0F0F0;             /* surface secundaria · blancoNeutro (era #ffffff) */
      --lightgray:   rgba(240,240,240,0.6);/* bordes suaves · blancoNeutro semi (era #e8dfd0) */
      --gray:        rgba(39,43,46,0.55); /* texto secundario · grisCarbon semi (era #8a7e72) */
      --darkgray:    #272B2E;             /* tinta principal · grisCarbon (era #1a1612) */
      --red:         #9B1B18;             /* alerta · rojoOtonal (era #b53b1f terracota) */
      --pale-navy:   rgba(85,30,27,0.12); /* fondo suave primario · vinotinto pale */
      --pale-green:  rgba(227,159,67,0.18);/* fondo suave naranjaClaro pale */
      --pale-blue:   rgba(247,243,161,0.45);/* fondo suave amarilloLuna pale */
      --pale-orange: rgba(227,159,67,0.18);/* fondo suave naranjaClaro pale (espejo) */
      --pale-red:    rgba(155,27,24,0.14);/* fondo suave alerta · rojoOtonal pale */

      /* Roles cromáticos accuracy heredados del micro iconosPixelArt para los markers */
      --colorAccuracyGood: var(--amarilloLuna);
      --colorAccuracyWarn: var(--naranjaClaro);
      --colorAccuracyBad:  var(--rojoOtonal);
      --colorPinFill:      var(--naranjaProfundo);
      --colorMarkerStroke: #FFFFFF;

      --r-card: 14px;
      --r-input: 12px;
      --r-pill: 999px;

      --shadow-sm: 0 1px 2px rgba(39, 43, 46, 0.04);
      --shadow-md: 0 2px 8px rgba(39, 43, 46, 0.08);
      --shadow-lg: 0 8px 24px rgba(39, 43, 46, 0.12);

      --t-fast: 120ms cubic-bezier(.4,.0,.2,1);
      --t-base: 200ms cubic-bezier(.4,.0,.2,1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'VT323', monospace;                                        /* F-05 RD-08 · VT323 bitmap chunky + fallback monospace del sistema */
      background: var(--offwhite);
      color: var(--navy);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      overscroll-behavior-y: contain;
    }
    button { font-family: inherit; }
    input, select, textarea { font-family: inherit; font-size: inherit; }

    /* App shell */
    .shell {
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--offwhite);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top bar (header B4B + banner conexión) */
    .topbar {
      background: var(--navy);
      color: var(--white);
      padding: env(safe-area-inset-top, 0px) 18px 14px;
      padding-top: max(env(safe-area-inset-top, 0px), 14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-md);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .topbar-logo {
      height: 36px;
      width: auto;
      flex-shrink: 0;
      display: block;
    }
    /* Placeholder en lugar de logo (R-07 · decisión developer 20260510 · sin logo definitivo aún) */
    .topbar-logo-placeholder {
      height: 36px;
      min-width: 96px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--white);
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.04em;
      color: var(--white);
      background: rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .topbar-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-title small {
      display: block;
      font-size: 10px;
      font-weight: 400;
      opacity: 0.7;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .topbar-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.85;
    }
    .topbar-status .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 0 var(--orange);
      animation: pulse-dot 2s infinite;
    }
    .topbar-status.online .dot { background: var(--green); }
    .topbar-status.offline .dot { background: var(--orange); }
    @keyframes pulse-dot {
      0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
      70% { box-shadow: 0 0 0 6px transparent; opacity: 0.7; }
      100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
    }

    /* Main scroll area */
    .view {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
    }
    .view.no-pad { padding: 0; }

    /* Bottom action bar (sticky · contenedor para botones inyectados por vistas) */
    .actionbar {
      position: sticky;
      bottom: 0;
      background: var(--white);
      border-top: 1px solid var(--lightgray);
      padding: 14px 18px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      display: flex;
      gap: 10px;
      z-index: 30;
      box-shadow: 0 -4px 16px rgba(39, 43, 46, 0.04);
    }
    .actionbar:empty { display: none; }
    .actionbar .btn { flex: 1; }
    .actionbar .btn.flex-0 { flex: 0 0 auto; }

    /* Headings */
    .h-kicker {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--green-dark);
      margin: 0 0 8px;
    }
    .h-title {
      font-size: 26px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--navy);
      margin: 0 0 6px;
    }
    .h-sub {
      font-size: 14px;
      color: var(--gray);
      margin: 0 0 22px;
      line-height: 1.45;
    }
    .h-section {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Cards */
    .card {
      background: var(--white);
      border: 1px solid var(--lightgray);
      border-radius: var(--r-card);
      padding: 18px;
      margin-bottom: 14px;
    }
    .card.tight { padding: 14px; }
    .card.green-accent { border-left: 4px solid var(--green); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 52px;
      padding: 0 20px;
      border-radius: var(--r-input);
      border: 1.5px solid transparent;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
      transition: transform var(--t-fast), background var(--t-fast), border-color var(--t-fast);
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover:not(:disabled) { background: #3A1311; }                /* F-05 · hover btn primary · vinotinto oscurecido (era #0a2236) */
    .btn-success { background: var(--green); color: var(--white); }
    .btn-success:hover:not(:disabled) { background: var(--green-dark); }
    .btn-secondary {
      background: var(--white);
      color: var(--navy);
      border-color: var(--lightgray);
    }
    .btn-secondary:hover:not(:disabled) { border-color: var(--navy); }
    .btn-ghost { background: transparent; color: var(--navy); }
    .btn-danger-ghost { background: transparent; color: var(--red); }
    .btn-block { width: 100%; }
    .btn-lg { min-height: 60px; font-size: 16px; }
    .btn-icon { width: 44px; height: 44px; min-height: 44px; padding: 0; flex-shrink: 0; }

    /* Predio card (bandeja) */
    .predio-row {
      background: var(--white);
      border: 1px solid var(--lightgray);
      border-radius: var(--r-card);
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all var(--t-fast);
    }
    .predio-row:active { transform: scale(0.99); }
    .predio-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--pale-green);
      color: var(--green-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 700;
    }
    .predio-info { flex: 1; min-width: 0; }
    .predio-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--navy);
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .predio-meta {
      font-size: 12px;
      color: var(--gray);
      letter-spacing: 0.02em;
    }
    .predio-actions { display: flex; gap: 4px; }
    .predio-action-btn {
      background: transparent;
      border: 1px solid var(--lightgray);
      width: 36px; height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--darkgray);
      transition: all var(--t-fast);
    }
    .predio-action-btn:active { transform: scale(0.92); }
    .predio-action-btn.danger { color: var(--red); }
    .predio-action-btn:hover { background: var(--pale-navy); }
    .predio-action-btn.danger:hover { background: var(--pale-red); border-color: var(--red); }

    /* Empty state (bandeja vacía) */
    .empty {
      text-align: center;
      padding: 40px 20px 20px;
    }
    .empty-icon {
      width: 84px; height: 84px;
      border-radius: 24px;
      background: var(--pale-green);
      color: var(--green-dark);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    /* F-05 RD-14 · SVG pixel art escalado al contenedor; pixelated heredado del bloque
       selectivo de arriba via .recorder-modeSelector-btn svg solo cubre modeSelector;
       aquí añadimos cobertura puntual para empty-icon (mismo principio: glifo del micro). */
    .empty-icon svg { width: 64px; height: 64px; image-rendering: pixelated; image-rendering: crisp-edges; }
    .empty-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    .empty-sub {
      font-size: 14px;
      color: var(--gray);
      margin: 0 0 22px;
      line-height: 1.5;
    }

    /* Polygon recorder shell */
    .poly-shell {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
      height: calc(100dvh - 60px);
      position: relative;                                                       /* fix-overlayDetrasHeader F-01 · ancestor positionado para overlays absolute hermanos · queda debajo del header sticky */
    }
    .poly-canvas {
      flex: 1;
      background: var(--pale-green);
      position: relative;
      overflow: hidden;
      background-image:
        linear-gradient(var(--lightgray) 1px, transparent 1px),
        linear-gradient(90deg, var(--lightgray) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .poly-canvas svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .poly-stats {
      position: absolute;
      top: 14px; left: 14px; right: 14px;
      background: rgba(39, 43, 46, 0.92);
      backdrop-filter: blur(8px);
      color: var(--white);
      padding: 14px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .poly-stat-num {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .poly-stat-lbl {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.7;
    }

    /* Recorder UI v2 — overlay flotante + panel lateral
       F-05 RD-13 · intercambiado: el padre vive en right:12px / flex-end;
       Mesure lo migra a left:12px / flex-start (stacks derecha↔izquierda). */
    .recorder-overlay {
      position: absolute;
      top: 12px;
      left: 12px;                                                              /* F-05 RD-13 · intercambio derecha↔izquierda · era right: 12px */
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
      pointer-events: none;
      align-items: flex-start;                                                 /* F-05 RD-13 · era flex-end · sigue al intercambio derecha→izquierda */
    }
    .recorder-stats-line {
      font-family: 'VT323', monospace;                                        /* F-05 RD-08 · pixel art monospace consistente */
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--darkgray);
      box-shadow: 0 1px 3px rgba(39, 43, 46, 0.18);
      backdrop-filter: blur(4px);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .recorder-stats-line.good { color: var(--darkgray); }
    .recorder-stats-line.warn { color: var(--naranjaProfundo); background: rgba(247, 243, 161, 0.96); }   /* F-05 · accuracy warn · naranjaProfundo sobre amarilloLuna semi */
    .recorder-stats-line.bad  { color: var(--rojoOtonal);     background: rgba(240, 240, 240, 0.96); }   /* F-05 · accuracy bad · rojoOtonal sobre blancoNeutro semi */
    .recorder-stats-line .lbl { opacity: 0.65; font-weight: 500; margin-right: 4px; }

    /* M4/T-15 F4+F5 · live divIcon (triángulo direccional / círculo parpadeante) */
    .recorder-live-icon { background: transparent; border: none; }
    .recorder-live-icon svg { display: block; pointer-events: none; }

    .recorder-hamburger {
      /* fix-layoutSolapamientosMapa F-02 · ahora vive dentro del .recorder-overlay flex column ·
         se ancla automáticamente debajo del último chip independientemente del nº de KPIs */
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--lightgray);
      box-shadow: 0 2px 6px rgba(39, 43, 46, 0.16);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 0;
      margin-top: 8px;                                                          /* separación visual del último chip */
      pointer-events: auto;                                                    /* overlay padre tiene pointer-events:none */
    }
    .recorder-hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--darkgray);
      border-radius: 2px;
    }
    .recorder-hamburger.open { background: var(--navy); }
    .recorder-hamburger.open span { background: var(--white); }

    /* fix-panelHoverYPinTraceCentro RF-02 · panel-section vive dentro del .recorder-overlay
       como sub-sección colapsable · sin container absolute propio · sin solape con chips KPI ·
       toggle visibilidad via .recorder-overlay.panel-open · expansión info via .recorder-overlay.info-expanded */
    .recorder-panel-section {
      display: none;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;                                                 /* F-05 RD-13 · era flex-end · panel-section sigue al overlay padre (lado izquierdo) */
      margin-top: 8px;
      pointer-events: auto;
    }
    .recorder-overlay.panel-open .recorder-panel-section { display: flex; }
    .recorder-panel-metrics {
      font-size: 10px;
      color: var(--darkgray);
      text-align: center;
      padding: 4px;
      border-radius: 8px;
      background: var(--pale-navy);
      line-height: 1.4;
      width: 100%;
    }
    .recorder-panel-metrics b { font-size: 12px; color: var(--navy); }
    .recorder-panel-divider {
      height: 1px;
      background: var(--lightgray);
      margin: 2px 4px;
      align-self: stretch;
    }
    .recorder-panel-info {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--pale-navy);
      color: var(--navy);
      border: none;
      font-size: 14px;
      font-weight: 800;
      font-style: italic;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background var(--t-fast);
    }
    .recorder-overlay.info-expanded .recorder-panel-info { background: var(--navy); color: var(--white); }
    .recorder-panel-btn {
      width: 44px;
      height: 44px;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity var(--t-fast), transform var(--t-fast), width 220ms cubic-bezier(.4,.0,.2,1);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      gap: 8px;
    }
    .recorder-overlay.info-expanded .recorder-panel-btn {
      width: 140px;
      justify-content: flex-start;
      padding: 0 12px;
    }
    .recorder-panel-btn:active { opacity: 0.7; }
    .recorder-panel-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .recorder-panel-btn.atras   { background: var(--lightgray); color: var(--darkgray); }
    .recorder-panel-btn.add     { background: var(--green); color: white; }
    .recorder-panel-btn.cerrar  { background: var(--navy); color: white; }
    .recorder-panel-btn.quitar  { background: var(--red); color: var(--white); }   /* M4/T-17 F7 · contraste invertido WCAG ≥4.5:1 */
    .r-panel-icon { font-size: 18px; line-height: 1; }
    .r-panel-label {
      display: none;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .recorder-overlay.info-expanded .r-panel-label { display: inline; }

    .recorder-warning {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 100px;
      background: rgba(240, 240, 240, 0.96);
      color: var(--rojoOtonal);                                                /* F-05 · warning sobre blancoNeutro semi */
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(39, 43, 46, 0.16);
      z-index: 8;
      display: none;
    }
    .recorder-warning.show { display: block; }

    @keyframes recorder-pulse {
      0%   { r: 2.4; opacity: 1; }
      50%  { r: 4.0; opacity: 0.5; }
      100% { r: 2.4; opacity: 1; }
    }
    .recorder-first-pulse { animation: recorder-pulse 1.2s ease-in-out infinite; }

    /* Banner */
    .banner {
      padding: 12px 14px;
      border-radius: var(--r-input);
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .banner-info    { background: var(--pale-blue);   color: var(--vinotinto);       border: 1px solid var(--vinotinto); }      /* F-05 · banner info · vinotinto sobre amarilloLuna pale */
    .banner-warn    { background: var(--pale-orange); color: var(--naranjaProfundo); border: 1px solid var(--naranjaProfundo); }/* F-05 · banner warn · naranjaProfundo sobre naranjaClaro pale */
    .banner-success { background: var(--pale-green);  color: var(--green-dark);      border: 1px solid var(--naranjaProfundo); }/* F-05 · banner success · idem warn (no hay verde en la paleta Moon) */
    .banner-danger  { background: var(--pale-red);    color: var(--rojoOtonal);      border: 1px solid var(--rojoOtonal); }     /* F-05 · banner danger · rojoOtonal sobre rojoOtonal pale */
    .banner b { font-weight: 700; }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      background: var(--navy);
      color: var(--white);
      padding: 12px 18px;
      border-radius: var(--r-input);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 100;
      max-width: calc(100% - 40px);
      animation: toast-in 200ms cubic-bezier(.4,.0,.2,1);
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Dialog (confirmDialog) */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(39, 43, 46, 0.5);
      backdrop-filter: blur(2px);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fade-in 150ms ease;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .dialog {
      background: var(--white);
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 22px 20px;
      padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      animation: slide-up 220ms cubic-bezier(.4,.0,.2,1);
    }
    @keyframes slide-up { from { transform: translateY(20px); } to { transform: translateY(0); } }
    .dialog h3 { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
    .dialog p { margin: 0 0 18px; color: var(--darkgray); font-size: 14px; line-height: 1.5; }
    .dialog-actions { display: flex; gap: 10px; }

    /* Utilities */
    .row { display: flex; align-items: center; gap: 8px; }
    .row-end { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .gap-12 { gap: 12px; }
    .mt-12 { margin-top: 12px; }
    .mt-20 { margin-top: 20px; }
    .mb-0 { margin-bottom: 0 !important; }
    .text-sm { font-size: 13px; }
    .text-gray { color: var(--gray); }
    .text-center { text-align: center; }
    .hidden { display: none !important; }

    /* ==========================================================
       OWNERSHIP ZONE · Agente A — Mapa Base
       Reglas .leaflet-* (overrides del CSS de Leaflet via CDN) +
       .recorder-mapBar-* (barra controles mapa hover izquierda).
       Ver feature MESO recorderMapaCaminarTrazar/spec.md §6.3
       ========================================================== */
    .map-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--pale-green);
      background-image:
        linear-gradient(var(--lightgray) 1px, transparent 1px),
        linear-gradient(90deg, var(--lightgray) 1px, transparent 1px);
      background-size: 24px 24px;
      isolation: isolate;                                                       /* fix-layoutSolapamientosMapa F-01 · stacking context aislado · controles hermanos quedan encima */
    }
    .leaflet-container { background: transparent; font-family: 'VT323', monospace; }
    .leaflet-control-attribution { font-size: 10px; opacity: 0.85; }

    .recorder-mapBar {
      position: absolute;
      top: 12px;
      right: 12px;                                                             /* F-05 RD-13 · intercambio derecha↔izquierda · era left: 12px */
      z-index: 11;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: auto;
    }
    .recorder-mapBar-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--lightgray);
      box-shadow: 0 2px 6px rgba(39, 43, 46, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--darkgray);
      font-size: 18px;
      font-weight: 700;
      padding: 0;
      transition: transform var(--t-fast), background var(--t-fast);
    }
    .recorder-mapBar-btn:active { transform: scale(0.92); }
    .recorder-mapBar-btn:hover { background: var(--white); }
    .recorder-mapBar-btn.toggle { background: var(--navy); color: var(--white); }
    .recorder-mapBar-controls {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .recorder-mapBar.collapsed .recorder-mapBar-controls { display: none; }

    .recorder-mapBanner {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      z-index: 12;
      pointer-events: none;
    }

    /* ==========================================================
       OWNERSHIP ZONE · Agente C — Modo Trazar (ofc_M5 · 20260506)
       Pin draggable + snap visual al primer punto.
       ========================================================== */
    .recorder-tracePin-icon { background: transparent; border: none; }
    .recorder-tracePin-icon svg { display: block; pointer-events: none; }
    .recorder-tracePin-marker { background: transparent; border: none; }

    /* ==========================================================
       OWNERSHIP ZONE · Agente D — Burger Menu Modos (ofc_M6 · 20260506)
       Selector modal Caminar/Trazar + expansión info auto-colapso 15s.
       Re-incorpora .chip* purgados en M2 para badge mode en bandeja.
       ========================================================== */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--r-pill);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .chip-info    { background: var(--pale-blue);   color: var(--vinotinto); }       /* F-05 · chip caminar · vinotinto sobre amarilloLuna pale */
    .chip-warning { background: var(--pale-orange); color: var(--naranjaProfundo); } /* F-05 · chip trazar · naranjaProfundo sobre naranjaClaro pale */
    .recorder-modeSelector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .recorder-modeSelector-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 22px 12px 18px;
      background: var(--white);
      border: 1.5px solid var(--lightgray);
      border-radius: var(--r-card);
      cursor: pointer;
      min-height: 120px;
      transition: all var(--t-fast);
      color: var(--navy);
      text-align: center;
    }
    .recorder-modeSelector-btn:active { transform: scale(0.97); }
    .recorder-modeSelector-btn:hover { border-color: var(--green); background: var(--pale-green); }
    .recorder-modeSelector-btn-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: var(--pale-green);
      color: var(--green-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
    }
    .recorder-modeSelector-btn-label {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .recorder-modeSelector-info {
      position: absolute;
      top: 8px; right: 8px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--pale-navy);
      color: var(--navy);
      border: none;
      font-size: 12px;
      font-weight: 800;
      font-style: italic;
      cursor: pointer;
      padding: 0;
      transition: background var(--t-fast);
    }
    .recorder-modeSelector-info:hover { background: var(--lightgray); }
    .recorder-modeSelector-info-text {
      display: none;
      grid-column: 1 / -1;
      font-size: 12px;
      color: var(--darkgray);
      line-height: 1.45;
      padding: 10px 12px;
      background: var(--pale-navy);
      border-radius: var(--r-input);
      margin-top: -6px;
    }
    .recorder-modeSelector-info-text.expanded { display: block; }

    /* ============================================================
       OWNERSHIP ZONE · Agente Iconografía · MOONTRIP MESURE · F-05
       image-rendering: pixelated selectivo · RD-14 spec
       Aplica a sprites pixel art (sello hero PNG + glifos SVG del micro
       iconosPixelArt + marker icons del overlay del mapa). NUNCA al
       .map-container / .leaflet-container / .leaflet-tile — degradaría
       la legibilidad de los tiles OSM/Esri (no son pixel art).
       ============================================================ */
    .topbar-logo-placeholder img,
    .recorder-mapBar-btn svg,
    .recorder-panel-btn svg,
    .recorder-modeSelector-btn svg,
    .recorder-hamburger svg,
    .recorder-live-icon svg,
    .predio-action-btn svg {
      image-rendering: pixelated;
      image-rendering: crisp-edges;                                            /* fallback Firefox: el último válido gana */
    }
    /* Salvaguarda explícita: el mapa NUNCA pixelated (preserva legibilidad de tiles raster). */
    .map-container,
    .leaflet-container,
    .leaflet-tile,
    .leaflet-tile-pane img { image-rendering: auto; }

    /* ============================================================
       OWNERSHIP ZONE · Agente Iconografía · MOONTRIP MESURE · F-05
       Sello hero moonV3_12 en .topbar-logo-placeholder.
       El padre exhibe un placeholder textual "geoPlacer"; F-05 RD-09
       lo reemplaza por <img> base64 inline del PNG noBackground.
       ============================================================ */
    .topbar-logo-placeholder {
      border: none;                                                            /* F-05 · sin borde · el PNG ya lleva su propia silueta */
      background: transparent;                                                 /* F-05 · transparente · el noBackground respira sobre el vinotinto */
      padding: 0;
    }
    .topbar-logo-placeholder img {
      height: 36px;
      width: auto;
      display: block;
    }

    /* Burger icon F-05 RD-10 · sustituye los 3-spans del padre por SVG inline iconBurger.
       Las reglas .recorder-hamburger span del padre se preservan vivas para no romper
       posibles overlays legacy (no se invocan: el HTML inyectado lleva svg directamente). */
    .recorder-hamburger svg { width: 24px; height: 24px; color: var(--darkgray); }
    .recorder-hamburger.open svg { color: var(--white); }

    /* Panel btn icons F-05 RD-11 · los <span class="r-panel-icon"> del padre alojan SVG. */
    .r-panel-icon svg { width: 20px; height: 20px; display: block; }

    /* MapBar btn icons F-05 RD-11 · los buttons alojan SVG en lugar de emoji. */
    .recorder-mapBar-btn svg { width: 22px; height: 22px; display: block; }

    /* Mode selector grid icons F-05 RD-11 · iconWalkMode + iconTraceMode. */
    .recorder-modeSelector-btn-icon svg { width: 32px; height: 32px; display: block; }

    /* Predio action btn icons F-05 RD-11. */
    .predio-action-btn svg { width: 18px; height: 18px; display: block; }

    /* ============================================================
       OWNERSHIP ZONE · Agente Cosmético · MOONTRIP MESURE · F-05
       Animación CSS de pulso para iconCircleMarker (markers fijos
       cercanos al primer punto · trace mode). Modelo del micro
       iconosPixelArt: transform:scale en lugar de attr r (portable).
       ============================================================ */
    @keyframes circleMarkerPulse {
      0%   { transform: scale(0.7); opacity: 1; }
      50%  { transform: scale(1.3); opacity: 0.45; }
      100% { transform: scale(0.7); opacity: 1; }
    }
    .circleMarkerPulse {
      transform-origin: center;
      transform-box: fill-box;
      animation: circleMarkerPulse 1.4s ease-in-out infinite;
    }

    /* ============================================================
       OWNERSHIP ZONE · Agente Cosmético · MOONTRIP MESURE · F-05
       Bloque de retorno a moonTripLanding · placeholder Wave 2.
       Discreto al pie del topbar; QR 96×96 sustituido en Wave 3.
       ============================================================ */
    .moontrip-returnRow {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 18px;
      background: var(--vinotinto);
      color: var(--amarilloLuna);
      font-size: 13px;
      border-bottom: 2px solid var(--grisCarbon);
    }
    .moontrip-returnRow a {
      color: var(--amarilloLuna);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .moontrip-returnRow .moontrip-langToggle {
      margin-left: auto;
      background: var(--amarilloLuna);
      color: var(--vinotinto);
      border: 2px solid var(--amarilloLuna);
      padding: 2px 10px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .moontrip-returnRow .moontrip-langToggle.alt {
      background: transparent;
      color: var(--amarilloLuna);
    }
    .moontrip-qrPlaceholder {
      width: 96px;
      height: 96px;
      background: var(--blancoNeutro);
      color: var(--grisCarbon);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      font-size: 10px;
      text-align: center;
      border: 2px solid var(--amarilloLuna);
      image-rendering: pixelated;
    }
    .moontrip-qrPlaceholder b { font-size: 11px; }

  // Distancia esférica (Haversine) entre dos coordenadas [lon, lat] en metros.
  function haversineMeters(p1, p2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(p2[1] - p1[1]);
    const dLon = toRad(p2[0] - p1[0]);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(p1[1])) * Math.cos(toRad(p2[1])) * Math.sin(dLon/2)**2;

    const dLon = toRad(p2[0] - p1[0]);
    const y = Math.sin(dLon) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);

    const toRad = d => d * Math.PI / 180;
    const latMean = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    const cosLat = Math.cos(toRad(latMean));
    let area = 0;
    for (let i = 0; i < pts.length; i++) {
      const j = (i + 1) % pts.length;
      area += (pts[j][0] - pts[i][0]) * (pts[j][1] + pts[i][1]);

          legacyReq.onerror = () => resolve(false);
          legacyReq.onsuccess = () => {
            const legacyDb = legacyReq.result;
            if (!legacyDb.objectStoreNames.contains('poligonos')) { legacyDb.close(); return resolve(false); }
            const ltx = legacyDb.transaction('poligonos', 'readonly').objectStore('poligonos').getAll();

              wtx.oncomplete = () => { legacyDb.close(); console.info('geoPlacer · migrados ' + rows.length + ' polígonos desde DB legacy.'); resolve(true); };
              wtx.onerror = () => { legacyDb.close(); resolve(false); };
            };
            ltx.onerror = () => { legacyDb.close(); resolve(false); };

  async function dbAll(store) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readonly').objectStore(store).getAll();
      tx.onsuccess = () => res(tx.result || []);
      tx.onerror = () => rej(tx.error);
    });
  }
  async function dbPut(store, val) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite').objectStore(store).put(val);
      tx.onsuccess = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  }
  async function dbDel(store, key) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite').objectStore(store).delete(key);
      tx.onsuccess = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  }
  // M3/T-08 · variante con key explícita para stores sin keyPath (ej. `tiles`).
  async function dbPutKeyed(store, val, key) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite').objectStore(store).put(val, key);
      tx.onsuccess = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  }
  async function dbCount(store) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readonly').objectStore(store).count();
      tx.onsuccess = () => res(tx.result || 0);
      tx.onerror = () => rej(tx.error);
    });
  }

  // Carga inicial · ordena por createdAt descendente (más recientes arriba en bandeja).
  async function loadPoligonosOnInit() {
    const all = await dbAll('poligonos');
    all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    state.poligonos = all;
  }

  // ============================================================
  // DOM HELPERS · alineados al padre para minimizar diff de transcripción
  // ============================================================
  const $ = sel => document.querySelector(sel);
  const $view = () => $('#view');
  const $action = () => $('#actionbar');
  const $overlay = () => $('#overlay');

  // ============================================================
  // UI HELPERS · toast + confirmDialog + actionbar
  // ============================================================
  function toast(msg, ms=2000) {
    const toastEl = document.createElement('div');
    toastEl.className = 'toast';
    toastEl.textContent = msg;
    $('#toast-host').appendChild(toastEl);
    setTimeout(() => toastEl.remove(), ms);
  }
  function confirmDialog(opts) {
    return new Promise(resolve => {
      const html = `
        <div class="dialog-backdrop" id="dialog-bd">
          <div class="dialog" onclick="event.stopPropagation()">
            <h3>${opts.title || '¿Continuar?'}</h3>
            <p>${opts.message || ''}</p>
            <div class="dialog-actions">
              <button class="btn btn-secondary" id="dlg-cancel">${opts.cancel || 'Cancelar'}</button>
              <button class="btn ${opts.danger ? 'btn-primary' : 'btn-success'}" id="dlg-ok" style="${opts.danger ? 'background:#9B1B18;border-color:#9B1B18;':''}">${opts.confirm || 'Aceptar'}</button>
            </div>
          </div>
        </div>`;
      $overlay().innerHTML = html;
      $('#dialog-bd').addEventListener('click', () => { $overlay().innerHTML=''; resolve(false); });
      $('#dlg-cancel').addEventListener('click', e => { e.stopPropagation(); $overlay().innerHTML=''; resolve(false); });
      $('#dlg-ok').addEventListener('click', e => { e.stopPropagation(); $overlay().innerHTML=''; resolve(true); });
    });
  }
  function setActionBar(html) { $action().innerHTML = html || ''; }
  function clearActionBar() { $action().innerHTML = ''; }

  // ============================================================
  // GEOLOCATION CONSENT + UX DENIAL · R-04 + R-05
  //   R-04 · disclaimer obligatorio antes del primer uso de Geolocation,
  //          bilingüe ES/EN (contextoProducto §idioma · disclaimers ambos idiomas).
  //          Consent persistido en localStorage para no repetir cada sesión.
  //   R-05 · al denegar permiso → banner persistente + botón explícito de retry manual.
  //          Reemplaza el toast efímero anterior. Nunca reintenta automáticamente.
  // ============================================================
  const GEO_CONSENT_KEY = 'geoplacer.geoConsent.v1';
  function hasGeolocationConsent() {
    try { return localStorage.getItem(GEO_CONSENT_KEY) === 'granted'; } catch (_) { return false; }
  }
  async function ensureGeolocationConsent() {
    if (hasGeolocationConsent()) return true;
    const ok = await confirmDialog({
      title: 'Permiso de ubicación · Location permission',
      message:
        '<b>ES:</b> Esta herramienta necesita acceder a tu ubicación (GPS) para capturar puntos del polígono. ' +
        'Tu posición se procesa localmente en este navegador y no se envía a ningún servidor.<br><br>' +
        '<b>EN:</b> This tool needs access to your location (GPS) to capture polygon points. ' +
        'Your position is processed locally in this browser and is not sent to any server.',
      confirm: 'Activar GPS · Enable GPS',
      cancel: 'Cancelar · Cancel'
    });
    if (ok) { try { localStorage.setItem(GEO_CONSENT_KEY, 'granted'); } catch (_) {} }
    return ok;
  }
  function showGeolocationDeniedBanner(parentEl, onRetry) {
    if (!parentEl) parentEl = $view();
    if (!parentEl) return;
    const existing = parentEl.querySelector('.geo-denied-banner');
    if (existing) existing.remove();
    const bannerEl = document.createElement('div');
    bannerEl.className = 'geo-denied-banner banner banner-danger';
    bannerEl.style.cssText = 'margin:12px;padding:12px;display:flex;flex-direction:column;gap:8px;';
    bannerEl.innerHTML =
      '<div><b>Permiso de ubicación denegado · Location permission denied.</b></div>' +
      '<div style="font-size:14px;">ES: Sin GPS no se pueden capturar puntos. Habilita el permiso en la configuración del navegador y reintenta.<br>' +
      'EN: Without GPS, points cannot be captured. Enable the permission in your browser settings and retry.</div>' +
      '<button class="btn btn-secondary geo-retry-btn" type="button" style="align-self:flex-start;">Reintentar · Retry</button>';
    parentEl.appendChild(bannerEl);
    bannerEl.querySelector('.geo-retry-btn').addEventListener('click', () => {
      bannerEl.remove();
      if (typeof onRetry === 'function') onRetry();
    });
  }

  // ============================================================
  // CONNECTION STATUS · pulso del topbar
  // ============================================================
  function updateConnectionStatus() {
    const pill = $('#status-pill');
    const text = $('#status-text');
    if (!pill || !text) return;
    state.online = navigator.onLine;
    pill.classList.toggle('online', state.online);
    pill.classList.toggle('offline', !state.online);
    text.textContent = state.online ? 'En línea' : 'Sin conexión';
  }
  window.addEventListener('online', updateConnectionStatus);
  window.addEventListener('offline', updateConnectionStatus);

  // ============================================================
  // EXPORT HELPERS · GeoJSON + descarga Blob URL + slug del filename
  // ============================================================
  function buildGeoJson(record) {
    if (!record.points || !record.points.length) return null;
    // points puede ser [lon, lat] o [lon, lat, accuracyMeters] (Opción B heredada del antecesor).
    // Coordinates GeoJSON solo lleva [lon, lat]; el accuracy va en properties.pointAccuracies.
    const src = record.points;
    const ring = src.map(p => [p[0], p[1]]);
    const accs = src.map(p => (p.length >= 3 && p[2] != null) ? +(+p[2]).toFixed(1) : null);
    if (ring.length > 0) {
      const first = ring[0], last = ring[ring.length-1];
      if (first[0] !== last[0] || first[1] !== last[1]) {
        ring.push([first[0], first[1]]);
        accs.push(accs[0]);
      }
    }
    return {
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        properties: {
          name: record.name,                                                    // I-3=B · placeholder auto 'Polígono YYYYMMDDHHmm'
          mode: record.mode || 'walk',                                          // M2/T-03 · 'walk' | 'trace' · default 'walk' por compat M1
          createdAt: new Date(record.createdAt).toISOString(),
          pointAccuracies: accs
        },
        geometry: { type: 'Polygon', coordinates: [ring] }
      }]
    };
  }
  function downloadBlob(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function slugify(s) {
    return (s || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-zA-Z0-9._-]+/g, '_')
      .replace(/^_+|_+$/g, '') || 'poligono';
  }


  // ============================================================
  // VIEW INBOX · bandeja de polígonos persistidos · adaptación del padre:
  // sin nombre_finca/predio_codigo/extensionista · sin TSV · `+ Nuevo
  // polígono` resetea draft y entra a viewPolygon.
  // ============================================================
  function viewInbox() {
    const items = state.poligonos.slice().sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    const empty = items.length === 0;
    let html = `
      <p class="h-kicker">Bandeja</p>
      <h1 class="h-title">Polígonos capturados</h1>
      <p class="h-sub">${empty ? 'Aún no hay polígonos. Toca «Nuevo polígono» para empezar.' : `Hay <b>${items.length}</b> polígono${items.length>1?'s':''} guardado${items.length>1?'s':''}.`}</p>
    `;
    if (!empty) {
      html += `
        <div class="banner banner-warn" style="margin-top:-6px">
          <span style="flex-shrink:0;margin-top:1px;width:20px;height:20px;display:inline-block;">${renderPixelGlyph('iconExport', 'currentColor')}</span>
          <div><b>Descarga el GeoJSON de cada polígono</b> para guardarlo en el celular. Si se borra el caché del navegador, los polígonos no descargados se pierden.</div>
        </div>
      `;
    }
    if (empty) {
      html += `
        <div class="empty">
          <div class="empty-icon" style="width:84px;height:84px;">
            ${renderPixelGlyph('iconWalkMode', 'currentColor')}
          </div>
          <h2 class="empty-title">Sin polígonos todavía</h2>
          <p class="empty-sub">Cada polígono capturado se guarda automáticamente aquí. Puedes exportarlos uno por uno cuando lo necesites.</p>
        </div>
      `;
    } else {
      html += `<div style="margin-top:6px">`;
      for (const r of items) {
        const initial = (r.name || 'P')[0].toUpperCase();
        const fecha = new Date(r.createdAt || 0);
        const fechaStr = fecha.toLocaleDateString('es-PE', { day:'2-digit', month:'short', year: 'numeric' });
        const numPts = r.points ? r.points.length : 0;
        // M6/T-30 · badge mode (G-M6-3=A chip texto coloreado)
        const mode = r.mode || 'walk';
        const chipCls = mode === 'trace' ? 'chip-warning' : 'chip-info';
        const chipLabel = mode === 'trace' ? 'trazar' : 'caminar';
        const modeBadge = `<span class="chip ${chipCls}" style="padding:2px 8px;font-size:10px;margin-left:6px">${chipLabel}</span>`;
        html += `
          <div class="predio-row" data-uuid="${r.uuid}">
            <div class="predio-icon">${initial}</div>
            <div class="predio-info">
              <p class="predio-name">${r.name || 'Sin nombre'}</p>
              <p class="predio-meta">${fechaStr} · ${numPts} pts ${modeBadge}</p>
            </div>
            <div class="predio-actions">
              <button class="predio-action-btn" data-action="export" data-uuid="${r.uuid}" title="Descargar GeoJSON">
                ${renderPixelGlyph('iconExport', 'currentColor')}
              </button>
              <button class="predio-action-btn danger" data-action="delete" data-uuid="${r.uuid}" title="Eliminar">
                ${renderPixelGlyph('iconDelete', 'currentColor')}
              </button>
            </div>
          </div>
        `;
      }
      html += `</div>`;
    }
    $view().innerHTML = html;

    // Action bar
    let bar = `<button class="btn btn-success btn-lg" id="new-poly" style="flex:1" data-i18n="newPolyBtn">+ Nuevo polígono</button>`;
    if (!empty) {
      bar = `<button class="btn btn-secondary flex-0" id="export-all" title="Exportar todos">
        ${renderPixelGlyph('iconExport', 'currentColor')}
      </button>` + bar;
    }
    setActionBar(bar);

    $('#new-poly').addEventListener('click', startNewPolygon);
    if ($('#export-all')) {
      $('#export-all').addEventListener('click', exportAll);
    }
    $view().querySelectorAll('.predio-row').forEach(row => {
      row.addEventListener('click', e => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const uuid = btn.dataset.uuid;
        if (action === 'export') exportPoligono(uuid);
        if (action === 'delete') deletePoligono(uuid);
      });
    });
  }

  function startNewPolygon() {
    // M6/T-29 · invoca selector modal · cabreado a setView con draft fresco según modo
    showModeSelector(mode => {
      state.draft = { poligono: [], mode: mode };
      setView(mode);
    });
  }

  async function exportPoligono(uuid) {
    const r = state.poligonos.find(x => x.uuid === uuid);
    if (!r) return;
    const geo = buildGeoJson(r);
    if (!geo) { toast('No hay polígono para exportar'); return; }
    const fname = slugify(r.name) + '.geojson';
    downloadBlob(fname, JSON.stringify(geo, null, 2), 'application/geo+json');
    toast('GeoJSON descargado');
  }

  async function exportAll() {
    if (!state.poligonos.length) return;
    let n = 0;
    for (const r of state.poligonos) {
      const geo = buildGeoJson(r);
      if (!geo) continue;
      const fname = slugify(r.name) + '.geojson';
      downloadBlob(fname, JSON.stringify(geo, null, 2), 'application/geo+json');
      n++;
      // small delay para no bloquear el navegador con múltiples descargas
      await new Promise(res => setTimeout(res, 200));
    }
    toast(`${n} GeoJSON descargado${n!==1?'s':''}`);
  }

  async function deletePoligono(uuid) {
    const r = state.poligonos.find(x => x.uuid === uuid);
    if (!r) return;
    const ok = await confirmDialog({
      title: '¿Eliminar polígono?',
      message: `Se eliminará <b>${r.name || 'este polígono'}</b> de la bandeja. Asegúrate de haberlo descargado antes. Esta acción no se puede deshacer.`,
      confirm: 'Eliminar',
      cancel: 'Cancelar',
      danger: true
    });
    if (!ok) return;
    await dbDel('poligonos', uuid);
    state.poligonos = state.poligonos.filter(x => x.uuid !== uuid);
    render();
    toast('Polígono eliminado');
  }

  // ============================================================
  // SET VIEW + ROUTER
  // ============================================================
  function setView(name) {
    state.view = name;
    render();
    window.scrollTo(0, 0);
    const v = $view(); if (v) v.scrollTop = 0;
  }

  function render() {
    const v = $view();
    if (!v) return;
    v.className = 'view';
    if (state.view === 'loading') { v.innerHTML = '<div class="empty"><p>Cargando…</p></div>'; clearActionBar(); return; }
    if (state.view === 'walk')    return viewWalkMode();                        // M4
    if (state.view === 'trace')   return viewTraceMode();                       // M5
    if (state.view === 'inbox')   return viewInbox();
    if (state.view === 'mapTest') return viewMapTest();                         // dev shortcut #mapTest (validación fase 1)
    v.innerHTML = '<p style="padding:20px;color:var(--gray);font-size:14px">Vista <code>' + state.view + '</code> desconocida.</p>';
    clearActionBar();
  }

  // ============================================================
  // BOOT
  // ============================================================
  async function boot() {
    updateConnectionStatus();
    try {
      await loadPoligonosOnInit();
      // M3 · permite validación empírica de fase 1 vía #mapTest sin tocar viewInbox (zone Agente D)
      let initialView = 'inbox';
      if (location.hash === '#mapTest') initialView = 'mapTest';
      else if (location.hash === '#walk')  { state.draft = { poligono: [], mode: 'walk' };  initialView = 'walk'; }
      else if (location.hash === '#trace') { state.draft = { poligono: [], mode: 'trace' }; initialView = 'trace'; }
      setView(initialView);
    } catch (e) {
      console.error('boot · IndexedDB error:', e);
      const v = $view();
      if (v) v.innerHTML = '<div class="banner banner-danger" style="margin:20px">' +
        '<b>No se pudo abrir la base local.</b><br>' + (e.message || e) + '</div>';
    }
  }
  // M3 · listener de cambios de hash para alternar mapTest sin recargar
  window.addEventListener('hashchange', () => {
    if (location.hash === '#mapTest' && state.view !== 'mapTest') setView('mapTest');
  });

  document.addEventListener('DOMContentLoaded', boot);

  // ============================================================
  // OWNERSHIP ZONE · Agente A — MAP INIT (ofc_M3 · 20260506)
  // API expuesta: initMap, getTileLayer, setProvider, cacheTilesForBbox,
  //   clearTilesCache, fitBoundsToPoints, getCurrentLatLng,
  //   showMapBar, toggleMapBarCollapsed, viewMapTest.
  // Consume: state.map, state.mapProvider, state.mapZoom, store IDB 'tiles'.
  // ============================================================
  // F-05 RD-11 · MAP_PROVIDERS.icon ya no es emoji (🗺/🛰) sino string SVG pixel art inline
  // del set iconosPixelArt (iconProviderOsm / iconProviderSat). Firma del objeto preservada:
  // sigue siendo string (consumida como innerHTML del button mb-provider · ver showMapBar).
  const MAP_PROVIDERS = {
    osm: {
      url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
      label: 'Callejero',
      icon: renderPixelGlyph('iconProviderOsm', 'currentColor')
    },
    sat: {
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics',
      maxZoom: 19,
      label: 'Satelital',
      icon: renderPixelGlyph('iconProviderSat', 'currentColor')
    }
  };

  // M3/T-08 · TileLayer subclase que cachea tiles en IDB store 'tiles'.
  // Comportamiento: cada tile se busca primero en IDB · si existe, se sirve desde blob;
  // si no, fetch HTTP + IDB.put + sirve. La key es '<provider>/<z>/<x>/<y>'.
  let TileLayerIDB = null;
  function ensureTileLayerIDBClass() {
    if (TileLayerIDB || !window.L) return;
    TileLayerIDB = L.TileLayer.extend({
      createTile: function(coords, done) {
        const tile = document.createElement('img');
        tile.setAttribute('role', 'presentation');
        tile.alt = '';
        const provider = this.options.providerName || state.mapProvider;
        const url = this.getTileUrl(coords);
        const key = provider + '/' + coords.z + '/' + coords.x + '/' + coords.y;

        dbGet('tiles', key).then(blob => {
          if (blob instanceof Blob) {
            tile.src = URL.createObjectURL(blob);
            tile.onload = () => { URL.revokeObjectURL(tile.src); done(null, tile); };
            return;
          }
          // Fetch + cache
          fetch(url, { mode: 'cors' }).then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.blob();
          }).then(b => {
            dbPutKeyed('tiles', b, key).catch(()=>{ /* cuota llena: silencioso */ });
            const u = URL.createObjectURL(b);
            tile.src = u;
            tile.onload = () => { URL.revokeObjectURL(u); done(null, tile); };
          }).catch(err => {
            // Sin red ni cache · marcar tile como error (Leaflet renderea grilla CSS por debajo)
            tile.classList.add('leaflet-tile-error');
            done(err, tile);
          });
        }).catch(err => done(err, tile));

        return tile;
      }
    });
  }

  function getTileLayer(name) {
    ensureTileLayerIDBClass();
    const p = MAP_PROVIDERS[name];
    if (!p) throw new Error('Provider desconocido: ' + name);
    return new TileLayerIDB(p.url, {
      attribution: p.attribution,
      maxZoom: p.maxZoom,
      providerName: name
    });
  }

  // M3/T-07 · crea Leaflet container, monta tile layer default, fitBounds Perú+Colombia.
  // fix-zoomIniGeolocalizado F-01 · acepta opts.skipInitialView para que el caller decida la vista.
  function initMap(containerId, opts) {
    if (!window.L) {
      console.error('Leaflet no disponible · CDN no cargó');
      return null;
    }
    opts = opts || {};
    const initialProvider = opts.provider || state.mapProvider || 'osm';
    state.mapProvider = initialProvider;
    const map = L.map(containerId, {
      zoomControl: false,                                                       // usamos botones custom en barra hover izq
      attributionControl: true
    });
    const layer = getTileLayer(initialProvider);
    layer.addTo(map);
    map._currentTileLayer = layer;
    if (!opts.skipInitialView) {
      // Default G-M2-4: fitBounds Perú+Colombia (vista panorámica · usado por mapTest)
      const b = CONFIG.PERU_COLOMBIA_BBOX;
      map.fitBounds([[b.latMin, b.lonMin], [b.latMax, b.lonMax]]);
    } else {
      // skipInitialView · setView neutral para que getCenter() no falle hasta que el caller lo override
      const b = CONFIG.PERU_COLOMBIA_BBOX;
      map.setView([(b.latMin + b.latMax) / 2, (b.lonMin + b.lonMax) / 2], 5);
    }
    state.map = map;
    state.mapZoom = map.getZoom();
    map.on('zoomend', () => { state.mapZoom = map.getZoom(); });
    return map;
  }

  // fix-zoomIniGeolocalizado F-02 · zoomIniFromGeolocation(zoom, fallbackBbox, onReady)
  // Pide getCurrentPosition con timeout 8s · si responde: setView(latlng, zoom)
  // · si falla/niega/timeout: fitBounds(fallbackBbox) silencioso (G-FIX2-4=K).
  // fix-panelHoverYPinTraceCentro F-04 · onReady callback opcional · se ejecuta tras setView o fallback
  // (permite a callers como viewTraceMode posicionar pin en la coordenada final).
  async function zoomIniFromGeolocation(zoomLevel, fallbackBbox, onReady) {
    if (!state.map) { if (onReady) onReady(); return; }
    const fallback = () => {
      if (state.map && fallbackBbox) {
        state.map.fitBounds([[fallbackBbox.latMin, fallbackBbox.lonMin], [fallbackBbox.latMax, fallbackBbox.lonMax]]);
      }
      if (onReady) onReady();
    };
    if (!navigator.geolocation) { fallback(); return; }
    // R-04 · pedir consentimiento explícito antes de invocar Geolocation
    const consent = await ensureGeolocationConsent();
    if (!consent) { fallback(); return; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        if (state.map) state.map.setView([pos.coords.latitude, pos.coords.longitude], zoomLevel);
        if (onReady) onReady();
      },
      (err) => {
        // R-05 · si fue denegado (code 1), banner persistente con retry; otros errores → fallback silencioso
        if (err && err.code === 1) {
          const parent = state.map && state.map.getContainer && state.map.getContainer().parentElement;
          showGeolocationDeniedBanner(parent, () => zoomIniFromGeolocation(zoomLevel, fallbackBbox, onReady));
        }
        fallback();
      },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  }

  // M3/T-09 · swap entre providers sin recargar el mapa.
  function setProvider(name) {
    if (!state.map || !MAP_PROVIDERS[name]) return;
    const map = state.map;
    if (map._currentTileLayer) map.removeLayer(map._currentTileLayer);
    const layer = getTileLayer(name);
    layer.addTo(map);
    map._currentTileLayer = layer;
    state.mapProvider = name;
  }

  // Helpers: convierte (lat, lon, zoom) → (xtile, ytile)
  function latLngToTile(lat, lon, z) {
    const n = Math.pow(2, z);
    const x = Math.floor((lon + 180) / 360 * n);
    const latRad = lat * Math.PI / 180;
    const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
    return { x: x, y: y };
  }
  function countTilesInBbox(bbox, zMin, zMax) {
    let total = 0;
    for (let z = zMin; z <= zMax; z++) {
      const tl = latLngToTile(bbox.latMax, bbox.lonMin, z);
      const br = latLngToTile(bbox.latMin, bbox.lonMax, z);
      total += (Math.abs(br.x - tl.x) + 1) * (Math.abs(br.y - tl.y) + 1);
    }
    return total;
  }

  // M3/T-10 · pre-fetch deliberado de tiles del bbox visible.
  async function cacheTilesForBbox(bbox, zoomRange) {
    if (!state.map) return { done: 0, total: 0 };
    const zMin = zoomRange.zMin, zMax = zoomRange.zMax;
    const provider = state.mapProvider;
    const urlTemplate = MAP_PROVIDERS[provider].url;
    const tileList = [];
    for (let z = zMin; z <= zMax; z++) {
      const tl = latLngToTile(bbox.latMax, bbox.lonMin, z);
      const br = latLngToTile(bbox.latMin, bbox.lonMax, z);
      for (let x = Math.min(tl.x, br.x); x <= Math.max(tl.x, br.x); x++) {
        for (let y = Math.min(tl.y, br.y); y <= Math.max(tl.y, br.y); y++) {
          tileList.push({ z: z, x: x, y: y });
        }
      }
    }
    const total = tileList.length;
    let done = 0, errors = 0;
    for (const tile of tileList) {
      const key = provider + '/' + tile.z + '/' + tile.x + '/' + tile.y;
      try {
        const existing = await dbGet('tiles', key);
        if (existing instanceof Blob) { done++; continue; }
        const url = urlTemplate.replace('{z}', tile.z).replace('{x}', tile.x).replace('{y}', tile.y);
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) { errors++; continue; }
        const blob = await response.blob();
        await dbPutKeyed('tiles', blob, key);
        done++;
      } catch (_) { errors++; }
      // Emit progress event
      window.dispatchEvent(new CustomEvent('recorder:tilesDownloadProgress', { detail: { done: done, total: total } }));
      // P-07 · delay 80 ms para respetar política OSM ~1 req/s en lotes grandes (verificado R-10)
      if (provider === 'osm') await new Promise(resolve => setTimeout(resolve, 80));
    }
    return { done: done, total: total, errors: errors };
  }

  async function clearTilesCache() {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('tiles', 'readwrite').objectStore('tiles').clear();
      tx.onsuccess = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  }

  function fitBoundsToPoints(points) {
    if (!state.map || !points || !points.length) return;
    const bnds = points.map(p => [p[1], p[0]]);                                 // [lat, lon]
    state.map.fitBounds(bnds, { padding: [40, 40] });
  }
  function getCurrentLatLng() {
    if (!state.map) return null;
    const c = state.map.getCenter();
    return [c.lat, c.lng];
  }

  async function handleDownloadTilesClick() {
    if (!state.map) return;
    const bnds = state.map.getBounds();
    const bbox = {
      latMin: bnds.getSouth(), latMax: bnds.getNorth(),
      lonMin: bnds.getWest(),  lonMax: bnds.getEast()
    };
    const zCurrent = state.map.getZoom();
    const zMin = zCurrent;
    const zMax = Math.min(zCurrent + 2, MAP_PROVIDERS[state.mapProvider].maxZoom);
    const totalTiles = countTilesInBbox(bbox, zMin, zMax);
    const estMB = (totalTiles * 20 / 1024).toFixed(1);                          // ~20 KB/tile promedio
    const ok = await confirmDialog({
      title: '¿Descargar tiles del mapa?',
      message: `Se descargarán <b>~${totalTiles}</b> tiles (zoom ${zMin}–${zMax}, provider <b>${MAP_PROVIDERS[state.mapProvider].label}</b>) · estimado <b>~${estMB} MB</b>. La descarga puede tardar varios minutos.`,
      confirm: 'Descargar',
      cancel: 'Cancelar'
    });
    if (!ok) return;
    toast('Descargando ' + totalTiles + ' tiles · puede tardar…');
    const result = await cacheTilesForBbox(bbox, { zMin: zMin, zMax: zMax });
    toast('Listo · ' + result.done + ' tiles guardados' + (result.errors ? ' · ' + result.errors + ' errores' : ''));
  }

  // ============================================================

  function viewWalkMode() {

            <button class="recorder-panel-btn cerrar" id="r-done"><span class="r-panel-icon">${renderPixelGlyph('iconDone','currentColor')}</span><span class="r-panel-label" data-i18n="panelDone">Cerrar</span></button>
            <button class="recorder-panel-btn add"    id="r-add"><span class="r-panel-icon">${renderPixelGlyph('iconPin','currentColor','#FFFFFF')}</span><span class="r-panel-label" data-i18n="panelAdd">+ Punto aquí</span></button>
            <button class="recorder-panel-btn atras"  id="r-cancel"><span class="r-panel-icon">${renderPixelGlyph('iconCancel','currentColor')}</span><span class="r-panel-label" data-i18n="panelCancel">Atrás</span></button>

    clearActionBar();

    initMap('map-walk', { skipInitialView: true });                             // fix-zoomIniGeolocalizado F-03 · primer fix centra
    const shell = $view().querySelector('.poly-shell');
    showMapBar(shell);

    const polyLayer = L.layerGroup().addTo(state.map);
    let liveMarker = null;
    let firstFixCentered = false;                                               // fix-zoomIniGeolocalizado F-03 · una sola vez

    // F4+F5 (G-M4-1=A umbral 0.3 m/s · G-M4-2=A divIcon SVG)
    // F-05 RD-12 · marker live walk renderizado con iconLiveArrow paramétrico del micro
    // iconosPixelArt: triángulo-cometa rotable cuando isMoving, círculo pulsante cuando idle.
    // Firma de la función preservada (retorna L.divIcon); sólo cambia el SVG embebido.
    function buildLiveDivIcon(fix) {
      const speed = fix && fix.speed;
      const heading = fix && fix.heading;
      const isMoving = speed != null && isFinite(speed) && speed > 0.3;
      const ql = accuracyToLevel(fix && fix.accuracy);
      // Gradiente cálido Moon Trip (RD-07 spec): good=amarilloLuna · warn=naranjaClaro · bad=rojoOtonal
      const color = ql.cls === 'good' ? '#F7F3A1' : (ql.cls === 'warn' ? '#E39F43' : '#9B1B18');
      let svgInner;
      if (isMoving) {
        const rot = heading != null && isFinite(heading) ? heading : 0;
        // iconLiveArrow del micro · shape-rendering="auto" excepción documentada (rotación continua libre).
        svgInner = `<svg viewBox="-12 -12 24 24" width="28" height="28" shape-rendering="auto" style="transform: rotate(${rot}deg);">
          <polygon points="0,-10 7,8 0,4 -7,8" fill="${color}" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>`;
      } else {
        // iconCircleMarker pulsante del micro · animación SMIL legacy del padre preservada (compat WebKit).
        svgInner = `<svg viewBox="-12 -12 24 24" width="28" height="28" shape-rendering="auto">
          <circle cx="0" cy="0" r="6" fill="${color}" stroke="#FFFFFF" stroke-width="1.5">
            <animate attributeName="r" values="5;9;5" dur="1.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0.45;1" dur="1.4s" repeatCount="indefinite"/>
          </circle>
        </svg>`;
      }
      return L.divIcon({ html: svgInner, className: 'recorder-live-icon', iconSize: [28, 28], iconAnchor: [14, 14] });
    }
    function updateLiveMarker(fix) {
      if (!fix) {
        if (liveMarker) { state.map.removeLayer(liveMarker); liveMarker = null; }
        return;
      }
      const latlng = [fix.lat, fix.lon];
      const icon = buildLiveDivIcon(fix);
      if (liveMarker) { liveMarker.setLatLng(latlng); liveMarker.setIcon(icon); }
      else liveMarker = L.marker(latlng, { icon: icon, interactive: false, keyboard: false }).addTo(state.map);
    }

    // T-14 · drawPoly Leaflet sustituye SVG del M1
    function drawPolyLeaflet() {
      polyLayer.clearLayers();
      const pts = state.draft.poligono || [];
      const liveFix = state.polygonRecording && state.polygonRecording.liveFix;
      const warnEl = $('#r-warning');
      if (warnEl) { warnEl.classList.remove('show'); warnEl.textContent = ''; }

      pts.forEach(p => {
        const acc = p.length >= 3 ? p[2] : null;
        if (acc != null && acc > 0) {
          L.circle([p[1], p[0]], { radius: acc, color: '#A1602A', fillColor: '#A1602A', fillOpacity: 0.12, stroke: false }).addTo(polyLayer);
        }
      });

      const latlngs = pts.map(p => [p[1], p[0]]);
      if (pts.length >= 3) {
        L.polygon(latlngs, { color: '#A1602A', weight: 1.5, fillOpacity: 0.18, lineJoin: 'round' }).addTo(polyLayer);
      } else if (pts.length >= 2) {
        L.polyline(latlngs, { color: '#A1602A', weight: 1.5 }).addTo(polyLayer);
      }

      let firstPulse = false;
      if (liveFix && pts.length >= 3) {
        const dM = haversineMeters([liveFix.lon, liveFix.lat], [pts[0][0], pts[0][1]]);
        if (dM < 15) firstPulse = true;
      }

      pts.forEach((p, i) => {
        const isLast = i === pts.length - 1;
        const isFirst = i === 0;
        const acc = p.length >= 3 ? p[2] : null;
        const sospechoso = (acc != null && acc > 50);
        const r = isLast ? 7 : (isFirst && firstPulse ? 9 : 5);
        const fill = isLast ? '#E39F43' : (sospechoso ? '#E39F43' : '#A1602A');                /* F-05 · last/warn=naranjaClaro · resto=naranjaProfundo */
        const stroke = sospechoso ? '#9B1B18' : '#FFFFFF';                                       /* F-05 · warning stroke=rojoOtonal */
        const cm = L.circleMarker([p[1], p[0]], {
          radius: r, fillColor: fill, color: stroke, weight: 2, fillOpacity: 1,
          dashArray: sospechoso ? '3,3' : null
        });
        cm.addTo(polyLayer);
        if (isFirst && firstPulse && cm._path) cm._path.classList.add('recorder-first-pulse');
      });

      if (liveFix) updateLiveMarker(liveFix);

      if (warnEl && pts.length >= 4) {
        const flat = pts.map(p => [p[0], p[1]]);
        if (polygonHasSelfIntersection(flat)) {
          warnEl.textContent = '⚠ El polígono tiene aristas que se cruzan — revisa puntos sospechosos (borde naranja punteado)';
          warnEl.classList.add('show');
        }
      }
    }

    function updateRecorderMetrics() {
      const pts = state.draft.poligono || [];
      $('#r-pts').textContent = pts.length;
      $('#r-area').textContent = pts.length >= 3 ? polygonAreaHa(pts).toFixed(2) : '0';
      $('#r-perim').textContent = pts.length >= 2 ? Math.round(polygonPerimeterMeters(pts)) : '0';
      const done = $('#r-done'); if (done) done.disabled = pts.length < 3;
      const undo = $('#r-undo'); if (undo) undo.disabled = pts.length === 0;
    }

    function applyLiveFix(fix) {
      state.polygonRecording.liveFix = fix;
      // fix-zoomIniGeolocalizado F-03 · centra mapa en primer fix válido (zoom 17 G-FIX2-3=I)
      if (!firstFixCentered && fix && fix.lat != null && fix.lon != null && state.map) {
        state.map.setView([fix.lat, fix.lon], 17);
        firstFixCentered = true;
      }
      const ql = accuracyToLevel(fix && fix.accuracy);
      const qEl = $('#r-quality'); const qVal = $('#r-quality-val');
      if (qEl && qVal) {
        qEl.classList.remove('good','warn','bad'); qEl.classList.add(ql.cls);
        qVal.textContent = ql.label + (fix && fix.accuracy != null ? ' · ±' + formatAccuracy(fix.accuracy) : '');
      }
      const hVal = $('#r-heading-val');
      if (hVal) hVal.textContent = formatHeading(fix && fix.heading);
      const sEl = $('#r-speed'); const sVal = $('#r-speed-val');
      if (sEl && sVal) {
        const cls = speedClass(fix && fix.speed);
        sEl.classList.remove('good','warn','bad'); sEl.classList.add(cls);
        sVal.textContent = formatSpeed(fix && fix.speed);
      }
      // T-18 dist+rumbo último
      const pts = state.draft.poligono || [];
      const dlVal = $('#r-distLast-val'); const blVal = $('#r-bearLast-val');
      if (fix && pts.length > 0) {
        const last = pts[pts.length - 1];
        const dM = haversineMeters([fix.lon, fix.lat], [last[0], last[1]]);
        const bD = bearingDegrees([last[0], last[1]], [fix.lon, fix.lat]);
        if (dlVal) dlVal.textContent = formatAccuracy(dM);
        if (blVal) blVal.textContent = formatHeading(bD);
      } else {
        if (dlVal) dlVal.textContent = '—';
        if (blVal) blVal.textContent = '—';
      }
      drawPolyLeaflet();
    }

    // R-04 + R-05 · consentimiento explícito antes de watchPosition; si denegado, banner persistente con retry
    function startWatch() {
      if (!navigator.geolocation || state.polygonRecording.watchId != null) return;
      try {
        state.polygonRecording.watchId = navigator.geolocation.watchPosition(
          pos => applyLiveFix({
            lat: pos.coords.latitude, lon: pos.coords.longitude,
            accuracy: pos.coords.accuracy, heading: pos.coords.heading,
            speed: pos.coords.speed, timestamp: pos.timestamp
          }),
          (err) => {
            applyLiveFix(null);
            if (err && err.code === 1) showGeolocationDeniedBanner(shell, () => startWatch());
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
        );
      } catch (_) {}
    }
    ensureGeolocationConsent().then(ok => {
      if (ok) startWatch();
      else showGeolocationDeniedBanner(shell, () => ensureGeolocationConsent().then(o => o && startWatch()));
    });

    function stopWatch() {
      const w = state.polygonRecording && state.polygonRecording.watchId;
      if (w != null && navigator.geolocation && navigator.geolocation.clearWatch) navigator.geolocation.clearWatch(w);
      state.polygonRecording = { liveFix: null, watchId: null };
    }

    async function tryAddPoint() {
      const fix = state.polygonRecording.liveFix;
      const fresh = fix && fix.timestamp && (Date.now() - fix.timestamp) < 5000;

      if (acc != null && acc > 50) {
