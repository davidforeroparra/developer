  // ============================================================
  // OWNERSHIP ZONE · Mapa & Persistencia (Ag. A) · MAP INIT
  // Heredado del padre v00 con paleta Moon. Tile providers + cache IDB + política
  // OSM 80ms (RD-18). showMapBar reubicado a la DERECHA (RD-13).
  // ============================================================
  var MAP_PROVIDERS = {
    osm: { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',                                           attribution: '&copy; OpenStreetMap contributors',          maxZoom: 19, label: 'Callejero', iconName: 'iconProviderOsm' },
    sat: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics', maxZoom: 19, label: 'Satelital', iconName: 'iconProviderSat' }
  };

  var TileLayerIDB = null;
  function ensureTileLayerIDBClass() {
    if (TileLayerIDB || !window.L) return;
    TileLayerIDB = L.TileLayer.extend({
      createTile: function (coords, done) {
        var tile = document.createElement('img');
        tile.setAttribute('role', 'presentation');
        tile.alt = '';
        var provider = this.options.providerName || state.mapProvider;
        var url = this.getTileUrl(coords);
        var key = provider + '/' + coords.z + '/' + coords.x + '/' + coords.y;
        dbGet('tiles', key).then(function (blob) {
          if (blob instanceof Blob) {
            tile.src = URL.createObjectURL(blob);
            tile.onload = function () { URL.revokeObjectURL(tile.src); done(null, tile); };
            return;
          }
          fetch(url, { mode: 'cors' }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.blob();
          }).then(function (b) {
            dbPutKeyed('tiles', b, key).catch(function () { /* cuota llena: silencioso */ });
            var u = URL.createObjectURL(b);
            tile.src = u;
            tile.onload = function () { URL.revokeObjectURL(u); done(null, tile); };
          }).catch(function (err) {
            tile.classList.add('leaflet-tile-error');
            done(err, tile);
          });
        }).catch(function (err) { done(err, tile); });
        return tile;
      }
    });
  }
  function getTileLayer(name) {
    ensureTileLayerIDBClass();
    var p = MAP_PROVIDERS[name];
    if (!p) throw new Error('Provider desconocido: ' + name);
    return new TileLayerIDB(p.url, { attribution: p.attribution, maxZoom: p.maxZoom, providerName: name });
  }
  function initMap(containerId, opts) {
    if (!window.L) { console.error('Leaflet no disponible · CDN no cargó'); return null; }
    opts = opts || {};
    var initialProvider = opts.provider || state.mapProvider || 'osm';
    state.mapProvider = initialProvider;
    var map = L.map(containerId, { zoomControl: false, attributionControl: true });
    var layer = getTileLayer(initialProvider);
    layer.addTo(map);
    map._currentTileLayer = layer;
    if (!opts.skipInitialView) {
      var b1 = CONFIG.PERU_COLOMBIA_BBOX;
      map.fitBounds([[b1.latMin, b1.lonMin], [b1.latMax, b1.lonMax]]);
    } else {
      var b2 = CONFIG.PERU_COLOMBIA_BBOX;
      map.setView([(b2.latMin + b2.latMax) / 2, (b2.lonMin + b2.lonMax) / 2], 5);
    }
    state.map = map;
    state.mapZoom = map.getZoom();
    map.on('zoomend', function () { state.mapZoom = map.getZoom(); });
    return map;
  }
  function zoomIniFromGeolocation(zoomLevel, fallbackBbox, onReady) {
    if (!state.map) { if (onReady) onReady(); return; }
    var fallback = function () {
      if (state.map && fallbackBbox) {
        state.map.fitBounds([[fallbackBbox.latMin, fallbackBbox.lonMin], [fallbackBbox.latMax, fallbackBbox.lonMax]]);
      }
      if (onReady) onReady();
    };
    if (!navigator.geolocation) { fallback(); return; }
    ensureGeolocationConsent().then(function (consent) {
      if (!consent) { fallback(); return; }
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          if (state.map) state.map.setView([pos.coords.latitude, pos.coords.longitude], zoomLevel);
          if (onReady) onReady();
        },
        function (err) {
          if (err && err.code === 1) {
            var parent = state.map && state.map.getContainer && state.map.getContainer().parentElement;
            showGeolocationDeniedBanner(parent, function () { zoomIniFromGeolocation(zoomLevel, fallbackBbox, onReady); });
          }
          fallback();
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    });
  }
  function setProvider(name) {
    if (!state.map || !MAP_PROVIDERS[name]) return;
    var map = state.map;
    if (map._currentTileLayer) map.removeLayer(map._currentTileLayer);
    var layer = getTileLayer(name);
    layer.addTo(map);
    map._currentTileLayer = layer;
    state.mapProvider = name;
  }
  function latLngToTile(lat, lon, z) {
    var n = Math.pow(2, z);
    var x = Math.floor((lon + 180) / 360 * n);
    var latRad = lat * Math.PI / 180;
    var y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
    return { x: x, y: y };
  }
  function countTilesInBbox(bbox, zMin, zMax) {
    var total = 0;
    for (var z = zMin; z <= zMax; z++) {
      var tl = latLngToTile(bbox.latMax, bbox.lonMin, z);
      var br = latLngToTile(bbox.latMin, bbox.lonMax, z);
      total += (Math.abs(br.x - tl.x) + 1) * (Math.abs(br.y - tl.y) + 1);
    }
    return total;
  }
  // P-07 política OSM 80ms preservada (RD-18)
  function cacheTilesForBbox(bbox, zoomRange) {
    if (!state.map) return Promise.resolve({ done: 0, total: 0 });
    var zMin = zoomRange.zMin, zMax = zoomRange.zMax;
    var provider = state.mapProvider;
    var urlTemplate = MAP_PROVIDERS[provider].url;
    var tileList = [];
    for (var z = zMin; z <= zMax; z++) {
      var tl = latLngToTile(bbox.latMax, bbox.lonMin, z);
      var br = latLngToTile(bbox.latMin, bbox.lonMax, z);
      for (var x = Math.min(tl.x, br.x); x <= Math.max(tl.x, br.x); x++) {
        for (var y = Math.min(tl.y, br.y); y <= Math.max(tl.y, br.y); y++) {
          tileList.push({ z: z, x: x, y: y });
        }
      }
    }
    var total = tileList.length;
    var done = 0, errors = 0;
    return new Promise(function (resolve) {
      var i = 0;
      function nextTile() {
        if (i >= tileList.length) return resolve({ done: done, total: total, errors: errors });
        var tile = tileList[i++];
        var key = provider + '/' + tile.z + '/' + tile.x + '/' + tile.y;
        dbGet('tiles', key).then(function (existing) {
          if (existing instanceof Blob) { done++; window.dispatchEvent(new CustomEvent('tracker:tilesDownloadProgress', { detail: { done: done, total: total } })); scheduleNext(); return; }
          var url = urlTemplate.replace('{z}', tile.z).replace('{x}', tile.x).replace('{y}', tile.y);
          fetch(url, { mode: 'cors' }).then(function (r) {
            if (!r.ok) { errors++; window.dispatchEvent(new CustomEvent('tracker:tilesDownloadProgress', { detail: { done: done, total: total } })); scheduleNext(); return; }
            return r.blob().then(function (b) {
              dbPutKeyed('tiles', b, key).then(function () { done++; window.dispatchEvent(new CustomEvent('tracker:tilesDownloadProgress', { detail: { done: done, total: total } })); scheduleNext(); }).catch(function () { errors++; scheduleNext(); });
            });
          }).catch(function () { errors++; scheduleNext(); });
        }).catch(function () { errors++; scheduleNext(); });
      }
      function scheduleNext() {
        if (provider === 'osm') setTimeout(nextTile, 80);
        else nextTile();
      }
      nextTile();
    });
  }
  function fitBoundsToPoints(points) {
    if (!state.map || !points || !points.length) return;
    var bnds = points.map(function (p) { return [p[1], p[0]]; });
    state.map.fitBounds(bnds, { padding: [40, 40] });
  }
  function getCurrentLatLng() {
    if (!state.map) return null;
    var c = state.map.getCenter();
    return [c.lat, c.lng];
  }

  // showMapBar · RD-13: ubicada en la DERECHA (intercambio respecto al padre)
  function showMapBar(parentEl) {
    if (!parentEl) return;
    var bar = document.createElement('div');
    bar.className = 'track-mapBar';
    bar.id = 'r-mapBar';
    var altProvider = state.mapProvider === 'osm' ? 'sat' : 'osm';
    bar.innerHTML =
      '<button class="track-mapBar-btn toggle" id="mb-toggle" aria-label="Colapsar/expandir">' + svgIcon('iconCollapse', { size: 22 }) + '</button>' +
      '<div class="track-mapBar-controls" id="mb-controls">' +
        '<button class="track-mapBar-btn" id="mb-zoomIn"  aria-label="Acercar">' + svgIcon('iconZoomIn',  { size: 22 }) + '</button>' +
        '<button class="track-mapBar-btn" id="mb-zoomOut" aria-label="Alejar">'  + svgIcon('iconZoomOut', { size: 22 }) + '</button>' +
        '<button class="track-mapBar-btn" id="mb-provider" aria-label="Cambiar mapa">' + svgIcon(MAP_PROVIDERS[altProvider].iconName, { size: 22 }) + '</button>' +
        '<button class="track-mapBar-btn" id="mb-download" aria-label="Descargar mapa offline">' + svgIcon('iconExport', { size: 22 }) + '</button>' +
      '</div>';
    parentEl.appendChild(bar);
    bar.querySelector('#mb-toggle').addEventListener('click', toggleMapBarCollapsed);
    bar.querySelector('#mb-zoomIn').addEventListener('click', function () { if (state.map) state.map.zoomIn(); });
    bar.querySelector('#mb-zoomOut').addEventListener('click', function () { if (state.map) state.map.zoomOut(); });
    bar.querySelector('#mb-provider').addEventListener('click', function () {
      var next = state.mapProvider === 'osm' ? 'sat' : 'osm';
      setProvider(next);
      var btn = bar.querySelector('#mb-provider');
      if (btn) btn.innerHTML = svgIcon(MAP_PROVIDERS[next === 'osm' ? 'sat' : 'osm'].iconName, { size: 22 });
    });
    bar.querySelector('#mb-download').addEventListener('click', handleDownloadTilesClick);
    return bar;
  }
  function toggleMapBarCollapsed() {
    var bar = $('#r-mapBar');
    if (!bar) return;
    bar.classList.toggle('collapsed');
  }
  function handleDownloadTilesClick() {
    if (!state.map) return;
    var bnds = state.map.getBounds();
    var bbox = { latMin: bnds.getSouth(), latMax: bnds.getNorth(), lonMin: bnds.getWest(), lonMax: bnds.getEast() };
    var zCurrent = state.map.getZoom();
    var zMin = zCurrent;
    var zMax = Math.min(zCurrent + 2, MAP_PROVIDERS[state.mapProvider].maxZoom);
    var totalTiles = countTilesInBbox(bbox, zMin, zMax);
    var estMB = (totalTiles * 20 / 1024).toFixed(1);
    confirmDialog({
      title: 'Descargar tiles del mapa?',
      message: 'Se descargaran <b>~' + totalTiles + '</b> tiles (zoom ' + zMin + '-' + zMax + ', provider <b>' + MAP_PROVIDERS[state.mapProvider].label + '</b>) · estimado <b>~' + estMB + ' MB</b>.',
      confirm: 'Descargar',
      cancel: t('cancel')
    }).then(function (ok) {
      if (!ok) return;
      toast('Descargando ' + totalTiles + ' tiles...');
      cacheTilesForBbox(bbox, { zMin: zMin, zMax: zMax }).then(function (result) {
        toast('Listo · ' + result.done + ' tiles' + (result.errors ? ' · ' + result.errors + ' errores' : ''));
      });
    });
  }
  function showOfflineMapBanner(parentEl) {
    if (!parentEl) return;
    var bannerEl = document.createElement('div');
    bannerEl.className = 'track-mapBanner';
    bannerEl.innerHTML = '<div class="banner banner-warn"><b>Mapa no disponible offline</b> · descarga tiles con red para usar en campo.</div>';
    parentEl.appendChild(bannerEl);
    return bannerEl;
  }
  function shouldShowOfflineBanner() {
    if (state.online) return Promise.resolve(false);
    return dbCount('tiles').then(function (n) { return n === 0; }).catch(function () { return true; });
  }

  // viewMapTest (#mapTest dev shortcut, RD-17)
  function viewMapTest() {
    $view().className = 'view no-pad';
    $view().innerHTML = '<div class="track-shell"><div class="map-container" id="map-test"></div></div>';
    clearActionBar();
    setActionBar('<button class="btn btn-secondary btn-block" id="map-test-back">&larr; ' + t('mapTestBack') + '</button>');
    $('#map-test-back').addEventListener('click', function () {
      if (state.map) { state.map.remove(); state.map = null; }
      $view().className = 'view';
      setView('inbox');
    });
    initMap('map-test');
    var shell = $view().querySelector('.track-shell');
    showMapBar(shell);
    shouldShowOfflineBanner().then(function (need) { if (need) showOfflineMapBanner(shell); });
  }

  // ============================================================
  // OWNERSHIP ZONE · Walk Tracking (Ag. B)
  // Loop watchPosition con filtro Q2 (§3.2 spec). Pausa/reanuda preserva draft.
  // Marker en vivo = iconLiveArrow rotado por heading. Vértices fijos = iconCircleMarker
  // coloreados por accuracyToQualityLabel. 5 chips KPI VT323. RD-03/06/07/10/16.
  // ============================================================
  function viewWalkMode() {
    if (!state.draft) state.draft = { points: [], mode: 'walk' };
    if (!state.draft.points) state.draft.points = [];
    state.draft.mode = 'walk';
    state.mode = 'walk';
    state.walkRecording = state.walkRecording || { liveFix: null, watchId: null, lastCapturedFix: null, captureRunning: true };

    $view().className = 'view no-pad';
    $view().innerHTML =
      '<div class="track-shell">' +
        '<div class="map-container" id="map-walk"></div>' +
        '<div class="track-overlay" id="r-overlay">' +
          '<div class="track-stats-line good" id="r-quality"><span class="lbl">' + t('kpiQuality') + ':</span><span id="r-quality-val">—</span></div>' +
          '<div class="track-stats-line good" id="r-heading"><span class="lbl">' + t('kpiHeading') + ':</span><span id="r-heading-val">—</span></div>' +
          '<div class="track-stats-line good" id="r-speed"><span class="lbl">' + t('kpiSpeed') + ':</span><span id="r-speed-val">—</span></div>' +
          '<div class="track-stats-line good" id="r-distLast"><span class="lbl">' + t('kpiDistLast') + ':</span><span id="r-distLast-val">—</span></div>' +
          '<div class="track-stats-line good" id="r-bearLast"><span class="lbl">' + t('kpiBearLast') + ':</span><span id="r-bearLast-val">—</span></div>' +
          '<button class="track-hamburger" id="r-burger" aria-label="Abrir panel"><img alt="" src="" data-key="moon56"></button>' +
          '<div class="track-panel-section" id="r-panel">' +
            '<button class="track-panel-info" id="r-panel-info" aria-label="Mostrar/ocultar texto">' + svgIcon('iconInfo', { size: 22 }) + '</button>' +
            '<button class="track-panel-btn quitar" id="r-undo">' + svgIcon('iconUndo', { size: 22 }) + '<span class="track-panel-label">' + t('btnUndo') + '</span></button>' +
            '<button class="track-panel-btn pausa"  id="r-pause">' + svgIcon('iconCancel', { size: 22 }) + '<span class="track-panel-label" id="r-pause-label">' + t('btnPause') + '</span></button>' +
            '<button class="track-panel-btn cerrar" id="r-done">' + svgIcon('iconDone', { size: 22 }) + '<span class="track-panel-label">' + t('btnSaveTrack') + '</span></button>' +
            '<button class="track-panel-btn atras"  id="r-cancel">' + svgIcon('iconCancel', { size: 22 }) + '<span class="track-panel-label">' + t('btnBack') + '</span></button>' +
          '</div>' +
        '</div>' +
      '</div>';
    clearActionBar();

    // Asigna moon56 al burger
    var burgerImg = $view().querySelector('#r-burger img');
    if (burgerImg) burgerImg.src = MOON_INLINE.moon56;

    initMap('map-walk', { skipInitialView: true });
    var shell = $view().querySelector('.track-shell');
    showMapBar(shell);

    var trackLayer = L.layerGroup().addTo(state.map);
    var liveMarker = null;
    var firstFixCentered = false;

    function buildLiveDivIcon(fix) {
      var ql = accuracyToLevel(fix && fix.accuracy);
      var color = qualityToMarkerColor(ql.label);
      var speed = fix && fix.speed;
      var heading = fix && fix.heading;
      var isMoving = speed != null && isFinite(speed) && speed > 0.3;
      var svgInner;
      if (isMoving) {
        svgInner = svgLiveArrow({ color: color, heading: heading, size: 28 });
      } else {
        svgInner = svgCircleMarker({ color: color, first: true });
      }
      return L.divIcon({ html: svgInner, className: 'track-live-icon', iconSize: [28, 28], iconAnchor: [14, 14] });
    }
    function updateLiveMarker(fix) {
      if (!fix) { if (liveMarker) { state.map.removeLayer(liveMarker); liveMarker = null; } return; }
      var latlng = [fix.lat, fix.lon];
      var icon = buildLiveDivIcon(fix);
      if (liveMarker) { liveMarker.setLatLng(latlng); liveMarker.setIcon(icon); }
      else liveMarker = L.marker(latlng, { icon: icon, interactive: false, keyboard: false }).addTo(state.map);
    }

    // Render del track: polilínea + vértices fijos coloreados por calidad.
    // NO cierra el ring. NO snap visual al primer punto. NO detección auto-intersecciones.
    function drawTrackLeaflet() {
      trackLayer.clearLayers();
      var pts = state.draft.points || [];
      var liveFix = state.walkRecording && state.walkRecording.liveFix;
      // halo de accuracy heredado del padre (radio en metros)
      pts.forEach(function (p) {
        var acc = p.length >= 3 ? p[2] : null;
        if (acc != null && acc > 0) {
          L.circle([p[1], p[0]], { radius: acc, color: 'var(--colorAcentoCalido)', fillColor: 'var(--colorAcentoCalido)', fillOpacity: 0.12, stroke: false }).addTo(trackLayer);
        }
      });
      var latlngs = pts.map(function (p) { return [p[1], p[0]]; });
      if (pts.length >= 2) {
        L.polyline(latlngs, { color: '#9B1B18', weight: 2 }).addTo(trackLayer);
      }
      // Vértices fijos: iconCircleMarker tinteado por accuracy (T-07)
      pts.forEach(function (p, i) {
        var acc = p.length >= 3 ? p[2] : null;
        var qLabel = accuracyToQualityLabel(acc);
        var color = qualityToMarkerColor(qLabel);
        var isLast = i === pts.length - 1;
        var isFirst = i === 0;
        var icon = L.divIcon({
          html: svgCircleMarker({ color: color, first: isFirst || isLast }),
          className: 'track-fixed-marker',
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });
        L.marker([p[1], p[0]], { icon: icon, interactive: false, keyboard: false }).addTo(trackLayer);
      });
      if (liveFix) updateLiveMarker(liveFix);
    }

    function updateActionButtons() {
      var pts = state.draft.points || [];
      var done = $('#r-done'); if (done) done.disabled = pts.length < 2;
      var undo = $('#r-undo'); if (undo) undo.disabled = pts.length === 0;
    }

    // FILTRO Q2 · §3.2 spec. Llamada en cada callback de watchPosition cuando
    // captureRunning === true. Primer fix incondicional. Decisión OR: capturar si
    // desplazamientoMetros > max(accAct, accPrev) * 1.2 O velocidadInstantanea >= 0.5.
    function applyQ2Filter(fixActual) {
      var rec = state.walkRecording;
      // 1) Primer vértice incondicional
      if (state.draft.points.length === 0) {
        pushVertice(fixActual);
        rec.lastCapturedFix = fixActual;
        return true;
      }
      // 2) Si captura está pausada: ignorar
      if (rec.captureRunning === false) return false;
      // 3) Si reanudando sin lastCapturedFix válido: tratar como inicio limpio
      if (!rec.lastCapturedFix) {
        rec.lastCapturedFix = fixActual;
        return false;
      }
      // 4) Calcular desplazamiento y velocidad
      var prev = rec.lastCapturedFix;
      var desplazamientoMetros = haversineMeters([prev.lon, prev.lat], [fixActual.lon, fixActual.lat]);
      var deltaT = (fixActual.timestamp - prev.timestamp) / 1000;
      if (deltaT <= 0) {
        console.warn('moonTripTracker · timestamp anómalo, fix descartado');
        return false;
      }
      var velocidadInstantaneaMps = desplazamientoMetros / deltaT;
      var accAct = (fixActual.accuracy != null && isFinite(fixActual.accuracy)) ? fixActual.accuracy : Infinity;
      var accPrev = (prev.accuracy != null && isFinite(prev.accuracy)) ? prev.accuracy : Infinity;
      var umbralAccuracy = Math.max(accAct, accPrev) * 1.2;
      // 5) Decisión OR
      var captura = (desplazamientoMetros > umbralAccuracy) || (velocidadInstantaneaMps >= 0.5);
      if (captura) {
        pushVertice(fixActual);
        rec.lastCapturedFix = fixActual;
        return true;
      }
      return false;
    }

    function pushVertice(fixActual) {
      var lat = fixActual.lat, lon = fixActual.lon, acc = fixActual.accuracy, ts = fixActual.timestamp;
      if (!isInsidePeru(lat, lon)) { toast(t('pointsOutsideBbox')); return false; }
      // Shape interno 4 componentes: [lon, lat, acc, ts] (RD-04)
      state.draft.points.push([+lon.toFixed(6), +lat.toFixed(6), acc != null ? +acc.toFixed(1) : null, ts]);
      updateActionButtons();
      drawTrackLeaflet();
      toast(t('toastPointSaved')(state.draft.points.length));
      return true;
    }

    // Actualiza los 5 KPI chips en cada fix (RD-16) · independiente del filtro Q2
    function updateKpiChips(fix) {
      // Calidad
      var ql = accuracyToLevel(fix && fix.accuracy);
      var qEl = $('#r-quality'); var qVal = $('#r-quality-val');
      if (qEl && qVal) {
        qEl.classList.remove('good', 'warn', 'bad'); qEl.classList.add(ql.cls);
        qVal.textContent = ql.label + (fix && fix.accuracy != null ? ' · ±' + formatAccuracy(fix.accuracy) : '');
      }
      // Rumbo
      var hVal = $('#r-heading-val');
      if (hVal) hVal.textContent = formatHeading(fix && fix.heading);
      // Velocidad
      var sEl = $('#r-speed'); var sVal = $('#r-speed-val');
      if (sEl && sVal) {
        var cls = speedClass(fix && fix.speed);
        sEl.classList.remove('good', 'warn', 'bad'); sEl.classList.add(cls);
        sVal.textContent = formatSpeed(fix && fix.speed);
      }
      // Dist + Rumbo último (vs último vértice capturado)
      var pts = state.draft.points || [];
      var dlVal = $('#r-distLast-val'); var blVal = $('#r-bearLast-val');
      if (fix && pts.length > 0) {
        var last = pts[pts.length - 1];
        var dM = haversineMeters([fix.lon, fix.lat], [last[0], last[1]]);
        var bD = bearingDegrees([last[0], last[1]], [fix.lon, fix.lat]);
        if (dlVal) dlVal.textContent = formatAccuracy(dM);
        if (blVal) blVal.textContent = formatHeading(bD);
      } else {
        if (dlVal) dlVal.textContent = '—';
        if (blVal) blVal.textContent = '—';
      }
    }

    function applyLiveFix(fix) {
      state.walkRecording.liveFix = fix;
      // Centra en el primer fix válido (heredado del padre v00 fix-zoomIniGeolocalizado F-03)
      if (!firstFixCentered && fix && fix.lat != null && fix.lon != null && state.map) {
        state.map.setView([fix.lat, fix.lon], 17);
        firstFixCentered = true;
      }
      updateKpiChips(fix);
      applyQ2Filter(fix);
      drawTrackLeaflet();
    }

    function startWatch() {
      if (!navigator.geolocation || state.walkRecording.watchId != null) return;
      try {
        state.walkRecording.watchId = navigator.geolocation.watchPosition(
          function (pos) {
            applyLiveFix({
              lat: pos.coords.latitude, lon: pos.coords.longitude,
              accuracy: pos.coords.accuracy, heading: pos.coords.heading,
              speed: pos.coords.speed, timestamp: pos.timestamp
            });
          },
          function (err) {
            applyLiveFix(null);
            if (err && err.code === 1) showGeolocationDeniedBanner(shell, function () { startWatch(); });
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
        );
      } catch (_) {}
    }
    ensureGeolocationConsent().then(function (ok) {
      if (ok) startWatch();
      else showGeolocationDeniedBanner(shell, function () { ensureGeolocationConsent().then(function (o) { if (o) startWatch(); }); });
    });

    function stopWatch() {
      var w = state.walkRecording && state.walkRecording.watchId;
      if (w != null && navigator.geolocation && navigator.geolocation.clearWatch) navigator.geolocation.clearWatch(w);
      state.walkRecording = { liveFix: null, watchId: null, lastCapturedFix: null, captureRunning: true };
    }
    function teardownMap() {
      if (state.map) { state.map.remove(); state.map = null; }
    }

    // Burger toggle
    $('#r-burger').addEventListener('click', function () {
      $('#r-overlay').classList.toggle('panel-open');
      $('#r-burger').classList.toggle('open');
    });
    // Info expandible 15s
    var panelInfoTimer = null;
    $('#r-panel-info').addEventListener('click', function () {
      var overlay = $('#r-overlay');
      var wasExpanded = overlay.classList.contains('info-expanded');
      if (panelInfoTimer) { clearTimeout(panelInfoTimer); panelInfoTimer = null; }
      if (wasExpanded) overlay.classList.remove('info-expanded');
      else {
        overlay.classList.add('info-expanded');
        panelInfoTimer = setTimeout(function () { overlay.classList.remove('info-expanded'); }, 15000);
      }
    });

    // Pausa/Reanuda (RD-06): toggle captureRunning + reset lastCapturedFix al reanudar
    // para tratar el siguiente fix como inicio limpio.
    $('#r-pause').addEventListener('click', function () {
      var rec = state.walkRecording;
      rec.captureRunning = !rec.captureRunning;
      var label = $('#r-pause-label');
      if (rec.captureRunning) {
        if (label) label.textContent = t('btnPause');
        rec.lastCapturedFix = null;                                                 // reset → próximo fix inicio limpio
        if (rec.watchId == null) startWatch();
        toast(t('btnResume'));
      } else {
        if (label) label.textContent = t('btnResume');
        toast(t('btnPause'));
      }
    });

    $('#r-cancel').addEventListener('click', function () {
      var pts = state.draft && state.draft.points;
      var doDiscard = function () {
        stopWatch(); teardownMap();
        state.draft = null; state.mode = null;
        $view().className = 'view';
        setView('inbox');
      };
      if (pts && pts.length > 0) {
        confirmDialog({
          title: t('confirmDiscardTitle'),
          message: t('confirmDiscardMsg')(pts.length),
          confirm: t('confirmDiscardYes'),
          cancel: t('confirmDiscardNo'),
          danger: true
        }).then(function (ok) { if (ok) doDiscard(); });
      } else { doDiscard(); }
    });

    $('#r-undo').addEventListener('click', function () {
      var pts = state.draft.points;
      if (!pts || pts.length === 0) return;
      pts.pop();
      updateActionButtons();
      drawTrackLeaflet();
      toast(t('toastUndo'));
    });

    $('#r-done').addEventListener('click', function () {
      var pts = state.draft.points;
      if (!pts || pts.length < 2) return;
      stopWatch();
      var now = new Date();
      var pad = function (n) { return String(n).padStart(2, '0'); };
      var stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + pad(now.getHours()) + pad(now.getMinutes());
      var record = {
        uuid: uuid4(),
        name: 'Trayecto ' + stamp,
        mode: 'walk',
        points: pts.slice(),
        createdAt: now.getTime()
      };
      dbPut('tracks', record).then(function () {
        state.tracks.unshift(record);
        state.draft = null; state.mode = null;
        teardownMap();
        toast(t('toastTrackSaved')(record.points.length));
        $view().className = 'view';
        setView('inbox');
      }).catch(function (e) {
        console.error('guardar trayecto walk · dbPut error:', e);
        toast('No se pudo guardar el trayecto');
      });
    });

    drawTrackLeaflet();
    updateActionButtons();
  }

  // ============================================================
  // OWNERSHIP ZONE · Trace Tracking & Mode Selector (Ag. C) · TRACE MODE
  // Drag manual del pin. Captura por tap con Date.now() como timestamp (RD-04).
  // NO snap visual al primer punto. NO cierre forzado. mode: 'trace' en GeoJSON
  // y velocidades null (RD-09).
  // ============================================================
  function buildTracePinIcon() {
    return L.divIcon({
      html: svgIcon('iconPin', { size: 32, primary: 'var(--colorPinFill)', stroke: 'var(--colorMarkerStroke)' }),
      className: 'track-tracePin-icon',
      iconSize: [32, 32],
      iconAnchor: [16, 30]
    });
  }
  function buildFixedTraceMarkerIcon(opts) {
    opts = opts || {};
    return L.divIcon({
      html: svgCircleMarker({ color: 'var(--colorPinFill)', first: !!opts.first }),
      className: 'track-fixed-marker',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
  }

  function viewTraceMode() {
    if (!state.draft) state.draft = { points: [], mode: 'trace' };
    if (!state.draft.points) state.draft.points = [];
    state.draft.mode = 'trace';
    state.mode = 'trace';

    $view().className = 'view no-pad';
    $view().innerHTML =
      '<div class="track-shell">' +
        '<div class="map-container" id="map-trace"></div>' +
        '<div class="track-overlay" id="t-overlay">' +
          '<div class="track-stats-line good" id="t-distLast"><span class="lbl">' + t('kpiDistLast') + ':</span><span id="t-distLast-val">—</span></div>' +
          '<div class="track-stats-line good" id="t-bearLast"><span class="lbl">' + t('kpiBearLast') + ':</span><span id="t-bearLast-val">—</span></div>' +
          '<div class="track-stats-line good" id="t-zoom"><span class="lbl">Zoom:</span><span id="t-zoom-val">—</span></div>' +
          '<button class="track-hamburger" id="t-burger" aria-label="Abrir panel"><img alt="" src="" data-key="moon56"></button>' +
          '<div class="track-panel-section" id="t-panel">' +
            '<button class="track-panel-info" id="t-panel-info" aria-label="Mostrar/ocultar texto">' + svgIcon('iconInfo', { size: 22 }) + '</button>' +
            '<button class="track-panel-btn quitar" id="t-undo">' + svgIcon('iconUndo', { size: 22 }) + '<span class="track-panel-label">' + t('btnUndo') + '</span></button>' +
            '<button class="track-panel-btn add"    id="t-fix">' + svgIcon('iconDone', { size: 22 }) + '<span class="track-panel-label">' + t('btnAddHere') + '</span></button>' +
            '<button class="track-panel-btn cerrar" id="t-done">' + svgIcon('iconDone', { size: 22 }) + '<span class="track-panel-label">' + t('btnSaveTrack') + '</span></button>' +
            '<button class="track-panel-btn atras"  id="t-cancel">' + svgIcon('iconCancel', { size: 22 }) + '<span class="track-panel-label">' + t('btnBack') + '</span></button>' +
          '</div>' +
        '</div>' +
      '</div>';
    clearActionBar();

    var burgerImg = $view().querySelector('#t-burger img');
    if (burgerImg) burgerImg.src = MOON_INLINE.moon56;

    initMap('map-trace', { skipInitialView: true });
    var shell = $view().querySelector('.track-shell');
    showMapBar(shell);

    var trackLayer = L.layerGroup().addTo(state.map);
    var pinMarker = null;

    function spawnPin() {
      var center = state.map.getCenter();
      pinMarker = L.marker(center, { icon: buildTracePinIcon(), draggable: true, autoPan: true, keyboard: false }).addTo(state.map);
      state.tracePin = { lat: center.lat, lon: center.lng, dragging: false };
      pinMarker.on('dragstart', function () { state.tracePin.dragging = true; });
      pinMarker.on('drag', function () {
        var ll = pinMarker.getLatLng();
        state.tracePin.lat = ll.lat; state.tracePin.lon = ll.lng;
        updatePinFeedback();
      });
      pinMarker.on('dragend', function () {
        state.tracePin.dragging = false;
        updatePinFeedback();
      });
      updatePinFeedback();
    }
    function updatePinFeedback() {
      var pts = state.draft.points || [];
      var dlVal = $('#t-distLast-val'); var blVal = $('#t-bearLast-val');
      if (state.tracePin && pts.length > 0) {
        var last = pts[pts.length - 1];
        var dM = haversineMeters([state.tracePin.lon, state.tracePin.lat], [last[0], last[1]]);
        var bD = bearingDegrees([last[0], last[1]], [state.tracePin.lon, state.tracePin.lat]);
        if (dlVal) dlVal.textContent = formatAccuracy(dM);
        if (blVal) blVal.textContent = formatHeading(bD);
      } else {
        if (dlVal) dlVal.textContent = pts.length === 0 ? 'Primer pto' : '—';
        if (blVal) blVal.textContent = '—';
      }
      redrawFixedTrace();
    }
    function redrawFixedTrace() {
      trackLayer.clearLayers();
      var pts = state.draft.points || [];
      var latlngs = pts.map(function (p) { return [p[1], p[0]]; });
      if (pts.length >= 2) {
        L.polyline(latlngs, { color: '#9B1B18', weight: 2 }).addTo(trackLayer);
      }
      pts.forEach(function (p, i) {
        var isFirst = i === 0;
        var m = L.marker([p[1], p[0]], {
          icon: buildFixedTraceMarkerIcon({ first: isFirst }),
          interactive: false,
          keyboard: false
        });
        m.addTo(trackLayer);
      });
      var zVal = $('#t-zoom-val'); if (zVal && state.map) zVal.textContent = state.map.getZoom();
    }
    state.map.on('zoomend', function () { var z = $('#t-zoom-val'); if (z && state.map) z.textContent = state.map.getZoom(); });

    function updateActionButtons() {
      var pts = state.draft.points || [];
      var done = $('#t-done'); if (done) done.disabled = pts.length < 2;
      var undo = $('#t-undo'); if (undo) undo.disabled = pts.length === 0;
    }
    function teardownMap() {
      if (state.map) { state.map.remove(); state.map = null; }
      pinMarker = null; state.tracePin = null;
    }

    $('#t-burger').addEventListener('click', function () {
      $('#t-overlay').classList.toggle('panel-open');
      $('#t-burger').classList.toggle('open');
    });
    var panelInfoTimerT = null;
    $('#t-panel-info').addEventListener('click', function () {
      var overlay = $('#t-overlay');
      var wasExpanded = overlay.classList.contains('info-expanded');
      if (panelInfoTimerT) { clearTimeout(panelInfoTimerT); panelInfoTimerT = null; }
      if (wasExpanded) overlay.classList.remove('info-expanded');
      else {
        overlay.classList.add('info-expanded');
        panelInfoTimerT = setTimeout(function () { overlay.classList.remove('info-expanded'); }, 15000);
      }
    });

    // Fijar punto · timestamp = Date.now() (RD-04). Shape interno 4 componentes
    // con accuracy = null (no hay GPS en modo trace).
    $('#t-fix').addEventListener('click', function () {
      if (!state.tracePin) return;
      var lat = state.tracePin.lat, lon = state.tracePin.lon;
      if (!isInsidePeru(lat, lon)) { toast(t('pointsOutsideBbox')); return; }
      state.draft.points.push([+lon.toFixed(6), +lat.toFixed(6), null, Date.now()]);
      state.map.removeLayer(pinMarker); pinMarker = null;
      updateActionButtons();
      redrawFixedTrace();
      toast(t('toastPointFixed')(state.draft.points.length));
      spawnPin();
    });

    $('#t-undo').addEventListener('click', function () {
      var pts = state.draft.points;
      if (!pts || pts.length === 0) return;
      pts.pop();
      updateActionButtons();
      redrawFixedTrace();
      toast(t('toastUndo'));
    });

    $('#t-cancel').addEventListener('click', function () {
      var pts = state.draft && state.draft.points;
      var doDiscard = function () {
        teardownMap();
        state.draft = null; state.mode = null;
        $view().className = 'view';
        setView('inbox');
      };
      if (pts && pts.length > 0) {
        confirmDialog({
          title: t('confirmDiscardTitle'),
          message: t('confirmDiscardMsg')(pts.length),
          confirm: t('confirmDiscardYes'),
          cancel: t('confirmDiscardNo'),
          danger: true
        }).then(function (ok) { if (ok) doDiscard(); });
      } else { doDiscard(); }
    });

    // Guardar trayecto · persiste con mode='trace'; velocidades quedan null por buildGeoJson.
    $('#t-done').addEventListener('click', function () {
      var pts = state.draft.points;
      if (!pts || pts.length < 2) return;
      var now = new Date();
      var pad = function (n) { return String(n).padStart(2, '0'); };
      var stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + pad(now.getHours()) + pad(now.getMinutes());
      var record = {
        uuid: uuid4(),
        name: 'Trayecto ' + stamp,
        mode: 'trace',
        points: pts.slice(),
        createdAt: now.getTime()
      };
      dbPut('tracks', record).then(function () {
        state.tracks.unshift(record);
        state.draft = null; state.mode = null;
        teardownMap();
        toast(t('toastTrackSaved')(record.points.length));
        $view().className = 'view';
        setView('inbox');
      }).catch(function (e) {
        console.error('guardar trayecto trace · dbPut error:', e);
        toast('No se pudo guardar el trayecto');
      });
    });

    zoomIniFromGeolocation(17, CONFIG.PERU_COLOMBIA_BBOX, function () {
      spawnPin();
      updateActionButtons();
      redrawFixedTrace();
    });
  }

  // ============================================================
  // OWNERSHIP ZONE · Trace Tracking & Mode Selector (Ag. C) · MODE SELECTOR
  // Modal con iconWalkMode / iconTraceMode del set pixel art (RD-02). Deshabilita
  // Caminar si navigator.geolocation no existe. Info expandible 15s heredado.
  // ============================================================
  function showModeSelector(callback) {
    var geolocAvailable = !!(navigator && navigator.geolocation);
    var html =
      '<div class="dialog-backdrop" id="dialog-bd-mode">' +
        '<div class="dialog" onclick="event.stopPropagation()">' +
          '<h3>' + t('modeSelTitle') + '</h3>' +
          '<p>' + t('modeSelSub') + '</p>' +
          '<div class="modeSelector-grid" id="ms-grid">' +
            '<button class="modeSelector-btn" data-mode="walk"' + (geolocAvailable ? '' : ' disabled title="' + t('modeWalkDisabled') + '"') + '>' +
              '<div class="modeSelector-btn-icon">' + svgIcon('iconWalkMode', { size: 44 }) + '</div>' +
              '<div class="modeSelector-btn-label">' + t('modeWalk') + '</div>' +
              '<button class="modeSelector-info" data-info="walk" aria-label="Info">' + svgIcon('iconInfo', { size: 16 }) + '</button>' +
            '</button>' +
            '<button class="modeSelector-btn" data-mode="trace">' +
              '<div class="modeSelector-btn-icon">' + svgIcon('iconTraceMode', { size: 44 }) + '</div>' +
              '<div class="modeSelector-btn-label">' + t('modeTrace') + '</div>' +
              '<button class="modeSelector-info" data-info="trace" aria-label="Info">' + svgIcon('iconInfo', { size: 16 }) + '</button>' +
            '</button>' +
            '<div class="modeSelector-info-text" id="info-walk">' + t('modeWalkInfo') + '</div>' +
            '<div class="modeSelector-info-text" id="info-trace">' + t('modeTraceInfo') + '</div>' +
          '</div>' +
          '<div class="dialog-actions">' +
            '<button class="btn btn-secondary btn-block" id="ms-cancel">' + t('cancel') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    $overlay().innerHTML = html;
    var infoTimer = null;
    var cleanup = function () {
      if (infoTimer) { clearTimeout(infoTimer); infoTimer = null; }
      $overlay().innerHTML = '';
    };
    $('#dialog-bd-mode').addEventListener('click', cleanup);
    $('#ms-cancel').addEventListener('click', function (e) { e.stopPropagation(); cleanup(); });
    $overlay().querySelectorAll('.modeSelector-info').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var which = btn.dataset.info;
        var target = $('#info-' + which);
        if (!target) return;
        var wasExpanded = target.classList.contains('expanded');
        $overlay().querySelectorAll('.modeSelector-info-text').forEach(function (el) { el.classList.remove('expanded'); });
        if (infoTimer) { clearTimeout(infoTimer); infoTimer = null; }
        if (!wasExpanded) {
          target.classList.add('expanded');
          infoTimer = setTimeout(function () { target.classList.remove('expanded'); }, 15000);
        }
      });
    });
    $overlay().querySelectorAll('.modeSelector-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        if (e.target.closest('.modeSelector-info')) return;
        if (btn.disabled) return;
        var mode = btn.dataset.mode;
        cleanup();
        if (callback) callback(mode);
      });
    });
  }

  // Conexión status (heredado del padre v00; usado por shouldShowOfflineBanner)
  function updateConnectionStatus() { state.online = navigator.onLine; }
  window.addEventListener('online', updateConnectionStatus);
  window.addEventListener('offline', updateConnectionStatus);
  updateConnectionStatus();
})();
</script>
</body>
</html>
