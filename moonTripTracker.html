<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=480, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F7F3A1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="moonTripTracker">
  <meta name="description" content="moonTripTracker · tester GPS de líneas (tracks) con filtro Q2 y velocidades · sub-proyecto Moon Trip in pocket">
  <title>moonTripTracker · GPS tracks</title>
  <!-- Leaflet 1.9.4 · idéntico al padre v00 (SRI heredado) — única dep externa permitida (RD-01) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    /* ============================================================
       PALETA · paletaBrandingMoon v1.1 (sources/050_moon/paletaBrandingMoon.json)
       7 hex: 6 Moon + blancoNeutro · ningún hex extra fuera de este bloque.
       Restricción WCAG: naranjaClaro PROHIBIDO como texto sobre amarilloLuna.
       ============================================================ */
    :root {
      --amarilloLuna:    #F7F3A1;
      --naranjaClaro:    #E39F43;
      --naranjaProfundo: #A1602A;
      --rojoOtonal:      #9B1B18;
      --vinotinto:       #551E1B;
      --grisCarbon:      #272B2E;
      --blancoNeutro:    #F0F0F0;

      /* Roles semánticos (RD-12) */
      --colorBase:                var(--amarilloLuna);
      --colorAcentoCalido:        var(--naranjaClaro);
      --colorDetalle:             var(--naranjaProfundo);
      --colorAcentoDramatico:     var(--rojoOtonal);
      --colorTextoSobreAmarillo:  var(--vinotinto);
      --colorContorno:            var(--grisCarbon);
      --colorFondoBody:           var(--blancoNeutro);

      /* Marker calidad gradiente cálido (RD-10) */
      --colorAccuracyGood:    var(--amarilloLuna);     /* Excelente/Bueno */
      --colorAccuracyWarn:    var(--naranjaClaro);     /* Aceptable */
      --colorAccuracyBad:     var(--rojoOtonal);       /* Pobre */
      --colorAccuracyVoid:    var(--vinotinto);        /* Sin señal */
      --colorPinFill:         var(--naranjaProfundo);
      --colorMarkerStroke:    var(--blancoNeutro);

      /* Glifo colors (mutables por context) */
      --glifoColorPrimario:   var(--grisCarbon);
      --glifoColorAcento:     var(--rojoOtonal);
      --glifoColorStroke:     var(--blancoNeutro);
    }

    /* ============================================================
       RESET MINIMAL · tipografia pixel art (RD-12)
       ============================================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'VT323', 'Courier New', monospace;
      font-size: 18px;
      line-height: 1.4;
      background: var(--colorFondoBody);
      color: var(--colorContorno);
      overscroll-behavior-y: contain;
    }
    button, input, select, textarea { font-family: inherit; font-size: inherit; }

    /* ============================================================
       SHELL · viewport fijo 480px mobile-first (RD-15)
       Desktop: contenedor centrado con fondo blancoNeutro.
       ============================================================ */
    .shell {
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--colorBase);
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 2px solid var(--colorContorno);
      border-right: 2px solid var(--colorContorno);
    }

    /* ============================================================
       TOPBAR · header con moonV3_12 noBackground + QR placeholder + retorno landing
       ============================================================ */
    .topbar {
      background: var(--colorBase);
      color: var(--colorTextoSobreAmarillo);
      padding: env(safe-area-inset-top, 0px) 14px 10px;
      padding-top: max(env(safe-area-inset-top, 0px), 10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 2px solid var(--colorContorno);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .topbar-logo {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .topbar-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--colorTextoSobreAmarillo);
    }
    .topbar-title small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      opacity: 0.75;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .topbar-extras {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qr-placeholder {
      width: 56px;
      height: 56px;
      background: var(--colorFondoBody);
      border: 2px solid var(--colorContorno);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--colorTextoSobreAmarillo);
      text-align: center;
      line-height: 1.1;
      flex-shrink: 0;
    }
    .lang-toggle {
      background: var(--colorContorno);
      color: var(--colorBase);
      border: 2px solid var(--colorContorno);
      padding: 4px 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .back-link {
      display: block;
      font-size: 12px;
      padding: 6px 14px;
      background: var(--colorBase);
      color: var(--colorTextoSobreAmarillo);
      border-bottom: 2px solid var(--colorContorno);
      text-decoration: none;
      letter-spacing: 0.04em;
    }
    .back-link:hover { background: var(--naranjaClaro); }

    /* ============================================================
       VIEW + ACTIONBAR
       ============================================================ */
    .view {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      background: var(--colorBase);
    }
    .view.no-pad { padding: 0; }
    .actionbar {
      position: sticky;
      bottom: 0;
      background: var(--colorFondoBody);
      border-top: 2px solid var(--colorContorno);
      padding: 12px 14px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex;
      gap: 8px;
      z-index: 30;
    }
    .actionbar:empty { display: none; }
    .actionbar .btn { flex: 1; }
    .actionbar .btn.flex-0 { flex: 0 0 auto; }

    /* ============================================================
       HEADINGS + TYPOGRAPHY
       ============================================================ */
    .h-kicker {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--colorAcentoDramatico);
      margin: 0 0 4px;
    }
    .h-title {
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--colorTextoSobreAmarillo);
      margin: 0 0 6px;
    }
    .h-sub {
      font-size: 16px;
      color: var(--colorTextoSobreAmarillo);
      margin: 0 0 18px;
      line-height: 1.35;
    }

    /* ============================================================
       BUTTONS · pixel art rectangular, sin border-radius redondeado
       ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 16px;
      border: 2px solid var(--colorContorno);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      background: var(--colorFondoBody);
      color: var(--colorContorno);
    }
    .btn:active { transform: translate(1px, 1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--colorAcentoDramatico); color: var(--blancoNeutro); }
    .btn-primary:hover:not(:disabled) { background: var(--vinotinto); }
    .btn-success { background: var(--colorAcentoCalido); color: var(--vinotinto); }
    .btn-success:hover:not(:disabled) { background: var(--naranjaProfundo); color: var(--blancoNeutro); }
    .btn-secondary { background: var(--colorFondoBody); color: var(--colorContorno); }
    .btn-secondary:hover:not(:disabled) { background: var(--amarilloLuna); }
    .btn-danger { background: var(--colorAcentoDramatico); color: var(--blancoNeutro); }
    .btn-block { width: 100%; }
    .btn-lg { min-height: 56px; font-size: 18px; }
    .btn-icon { width: 44px; height: 44px; min-height: 44px; padding: 0; flex-shrink: 0; }
    .btn svg { width: 22px; height: 22px; vertical-align: middle; }

    /* ============================================================
       TRACK ROW (BANDEJA) · pixel art card
       ============================================================ */
    .track-row {
      background: var(--colorFondoBody);
      border: 2px solid var(--colorContorno);
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .track-icon {
      width: 40px; height: 40px;
      background: var(--colorAcentoCalido);
      color: var(--vinotinto);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 18px;
      border: 2px solid var(--colorContorno);
    }
    .track-info { flex: 1; min-width: 0; }
    .track-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--colorContorno);
      margin: 0 0 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-meta {
      font-size: 13px;
      color: var(--colorTextoSobreAmarillo);
      letter-spacing: 0.02em;
    }
    .track-actions { display: flex; gap: 4px; }
    .track-action-btn {
      background: transparent;
      border: 2px solid var(--colorContorno);
      width: 36px; height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--colorContorno);
      padding: 0;
    }
    .track-action-btn:active { transform: translate(1px, 1px); }
    .track-action-btn.danger { color: var(--colorAcentoDramatico); border-color: var(--colorAcentoDramatico); }
    .track-action-btn svg { width: 20px; height: 20px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: 1px solid var(--colorContorno);
      text-transform: uppercase;
    }
    .chip-walk { background: var(--amarilloLuna); color: var(--vinotinto); }
    .chip-trace { background: var(--naranjaClaro); color: var(--vinotinto); }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 32px 16px;
    }
    .empty-icon {
      width: 72px; height: 72px;
      background: var(--colorAcentoCalido);
      border: 2px solid var(--colorContorno);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .empty-icon svg { width: 40px; height: 40px; }
    .empty-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px;
      color: var(--colorTextoSobreAmarillo);
    }
    .empty-sub {
      font-size: 15px;
      color: var(--colorTextoSobreAmarillo);
      margin: 0 0 18px;
      line-height: 1.4;
    }

    /* ============================================================
       MAP SHELL · poly-shell renombrado a track-shell
       ============================================================ */
    .track-shell {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
      height: calc(100dvh - 60px);
      position: relative;
    }
    .map-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--colorBase);
      isolation: isolate;
    }
    .leaflet-container { background: transparent; font-family: 'VT323', monospace; }
    .leaflet-control-attribution { font-size: 11px; opacity: 0.85; }

    /* ============================================================
       OWNERSHIP ZONE · CSS Estética · Mapa controls (RD-13)
       INTERCAMBIO STACKS · barra mapa hover en la DERECHA (padre v00 era izquierda)
       ============================================================ */
    .track-mapBar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 11;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: auto;
    }
    .track-mapBar-btn {
      width: 36px;
      height: 36px;
      background: var(--colorFondoBody);
      border: 2px solid var(--colorContorno);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--colorContorno);
      padding: 0;
    }
    .track-mapBar-btn:active { transform: translate(1px, 1px); }
    .track-mapBar-btn:hover { background: var(--amarilloLuna); }
    .track-mapBar-btn.toggle { background: var(--colorContorno); color: var(--colorBase); }
    .track-mapBar-controls {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .track-mapBar.collapsed .track-mapBar-controls { display: none; }
    .track-mapBar-btn svg { width: 22px; height: 22px; }

    /* ============================================================
       OWNERSHIP ZONE · CSS Estética · Overlay panel (RD-13)
       INTERCAMBIO STACKS · overlay con chips KPI + panel-section en la IZQUIERDA
       (padre v00 era derecha)
       ============================================================ */
    .track-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
      pointer-events: none;
      align-items: flex-start;
    }
    .track-stats-line {
      font-family: 'VT323', monospace;
      font-size: 15px;
      font-weight: 400;
      padding: 3px 10px;
      background: var(--colorFondoBody);
      color: var(--colorContorno);
      border: 2px solid var(--colorContorno);
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .track-stats-line.good { background: var(--amarilloLuna); color: var(--vinotinto); }
    .track-stats-line.warn { background: var(--naranjaClaro); color: var(--vinotinto); }
    .track-stats-line.bad  { background: var(--rojoOtonal);   color: var(--blancoNeutro); }
    .track-stats-line .lbl { opacity: 0.7; font-weight: 400; margin-right: 4px; }

    .track-live-icon { background: transparent; border: none; }
    .track-live-icon svg { display: block; pointer-events: none; }
    .track-fixed-marker { background: transparent; border: none; }
    .track-tracePin-icon { background: transparent; border: none; }
    .track-tracePin-icon svg { display: block; pointer-events: none; }

    /* Burger (moonV3_12 inline) · ancla bajo el último chip · pointer-events:auto */
    .track-hamburger {
      width: 44px;
      height: 44px;
      background: var(--colorFondoBody);
      border: 2px solid var(--colorContorno);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 4px;
      margin-top: 6px;
      pointer-events: auto;
    }
    .track-hamburger.open { background: var(--colorContorno); }
    .track-hamburger img {
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: none;
    }
    .track-hamburger.open img { filter: invert(1) brightness(1.4); }

    .track-panel-section {
      display: none;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
      margin-top: 6px;
      pointer-events: auto;
    }
    .track-overlay.panel-open .track-panel-section { display: flex; }
    .track-panel-info {
      width: 36px; height: 36px;
      background: var(--colorFondoBody);
      color: var(--colorContorno);
      border: 2px solid var(--colorContorno);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .track-overlay.info-expanded .track-panel-info { background: var(--colorContorno); color: var(--colorBase); }
    .track-panel-info svg { width: 22px; height: 22px; }

    .track-panel-btn {
      min-width: 44px;
      height: 44px;
      min-height: 44px;
      border: 2px solid var(--colorContorno);
      cursor: pointer;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: width 200ms ease;
    }
    .track-overlay.info-expanded .track-panel-btn {
      min-width: 150px;
      justify-content: flex-start;
      padding: 0 12px;
    }
    .track-panel-btn:active { transform: translate(1px, 1px); }
    .track-panel-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .track-panel-btn.atras   { background: var(--colorFondoBody); color: var(--colorContorno); }
    .track-panel-btn.add     { background: var(--colorAcentoCalido); color: var(--vinotinto); }
    .track-panel-btn.cerrar  { background: var(--colorContorno); color: var(--colorBase); }
    .track-panel-btn.quitar  { background: var(--colorAcentoDramatico); color: var(--blancoNeutro); }
    .track-panel-btn.pausa   { background: var(--naranjaProfundo); color: var(--blancoNeutro); }
    .track-panel-btn svg { width: 22px; height: 22px; }
    .track-panel-label {
      display: none;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .track-overlay.info-expanded .track-panel-label { display: inline; }

    /* ============================================================
       DIALOG · pixel art modal (mode selector + confirmDialog)
       ============================================================ */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(39, 43, 46, 0.6);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .dialog {
      background: var(--colorBase);
      width: 100%;
      max-width: 480px;
      border: 2px solid var(--colorContorno);
      padding: 20px 18px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    }
    .dialog h3 { margin: 0 0 8px; font-size: 22px; font-weight: 700; color: var(--colorTextoSobreAmarillo); }
    .dialog p { margin: 0 0 16px; color: var(--colorTextoSobreAmarillo); font-size: 16px; line-height: 1.4; }
    .dialog-actions { display: flex; gap: 8px; }

    /* Mode selector */
    .modeSelector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .modeSelector-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 10px 14px;
      background: var(--colorFondoBody);
      border: 2px solid var(--colorContorno);
      cursor: pointer;
      min-height: 120px;
      color: var(--colorContorno);
      text-align: center;
    }
    .modeSelector-btn:active { transform: translate(1px, 1px); }
    .modeSelector-btn:hover:not(:disabled) { background: var(--amarilloLuna); }
    .modeSelector-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .modeSelector-btn-icon {
      width: 56px; height: 56px;
      background: var(--colorAcentoCalido);
      border: 2px solid var(--colorContorno);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vinotinto);
    }
    .modeSelector-btn-icon svg { width: 44px; height: 44px; }
    .modeSelector-btn-label {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--colorTextoSobreAmarillo);
    }
    .modeSelector-info {
      position: absolute;
      top: 6px; right: 6px;
      width: 24px; height: 24px;
      background: var(--colorFondoBody);
      color: var(--colorContorno);
      border: 1px solid var(--colorContorno);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modeSelector-info svg { width: 16px; height: 16px; }
    .modeSelector-info-text {
      display: none;
      grid-column: 1 / -1;
      font-size: 14px;
      color: var(--colorTextoSobreAmarillo);
      line-height: 1.4;
      padding: 8px 10px;
      background: var(--blancoNeutro);
      border: 2px solid var(--colorContorno);
      margin-top: -4px;
    }
    .modeSelector-info-text.expanded { display: block; }

    /* ============================================================
       TOAST + BANNER
       ============================================================ */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      background: var(--colorContorno);
      color: var(--colorBase);
      padding: 10px 16px;
      border: 2px solid var(--colorContorno);
      font-size: 15px;
      font-weight: 400;
      z-index: 100;
      max-width: calc(100% - 32px);
      letter-spacing: 0.02em;
    }
    .banner {
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 12px;
      border: 2px solid var(--colorContorno);
      background: var(--colorFondoBody);
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .banner-info    { background: var(--blancoNeutro); }
    .banner-warn    { background: var(--naranjaClaro); color: var(--vinotinto); }
    .banner-success { background: var(--amarilloLuna); color: var(--vinotinto); }
    .banner-danger  { background: var(--rojoOtonal); color: var(--blancoNeutro); border-color: var(--vinotinto); }
    .banner b { font-weight: 700; }

    .geo-denied-banner { margin: 12px; }
    .geo-retry-btn { margin-top: 4px; align-self: flex-start; }

    /* ============================================================
       UTILITIES
       ============================================================ */
    .hidden { display: none !important; }
    .text-sm { font-size: 14px; }
    .text-center { text-align: center; }
    .row { display: flex; align-items: center; gap: 8px; }
    .mt-12 { margin-top: 12px; }

    /* SVG inline rendering pixel-perfect */
    svg[shape-rendering="crispEdges"] {
      image-rendering: pixelated;
      image-rendering: crisp-edges;

  // Render motor: matriz ASCII 24x24 -> SVG rects pixel-perfect
  function pintaMatriz(filas, opts) {
    opts = opts || {};
    var primary = opts.primary || 'var(--glifoColorPrimario)';
    var stroke = opts.stroke || 'var(--glifoColorStroke)';
    var rects = [];
    for (var y = 0; y < 24; y++) {
      var fila = filas[y] || '';
      for (var x = 0; x < 24; x++) {
        var c = fila.charAt(x);
        if (c === '.') continue;
        var fill = primary;
        if (c === 'w') fill = stroke;
        if (c === 'a') fill = 'var(--glifoColorAcento)';
        rects.push('<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + fill + '"/>');
      }
    }
    var size = opts.size || 24;
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" shape-rendering="crispEdges">' + rects.join('') + '</svg>';
  }
  function svgIcon(nombre, opts) {
    var m = ICON_MATRICES[nombre];
    if (!m) return '';
    return pintaMatriz(m, opts);
  }
  // iconLiveArrow: paramétrico, shape-rendering="auto" para rotación libre (RD-16)
  function svgLiveArrow(opts) {
    opts = opts || {};
    var color = opts.color || 'var(--colorAccuracyGood)';
    var rot = opts.heading != null && isFinite(opts.heading) ? opts.heading : 0;
    var size = opts.size || 28;
    return '<svg viewBox="-12 -12 24 24" width="' + size + '" height="' + size + '" shape-rendering="auto" style="transform: rotate(' + rot + 'deg);">' +
             '<polygon points="0,-10 7,8 0,4 -7,8" fill="' + color + '" stroke="var(--colorMarkerStroke)" stroke-width="1.5" stroke-linejoin="round"/>' +
           '</svg>';
  }
  // iconCircleMarker: paramétrico, color por calidad
  function svgCircleMarker(opts) {
    opts = opts || {};
    var color = opts.color || 'var(--colorAccuracyGood)';
    var r = opts.first ? 9 : 7;
    var size = (r * 2) + 6;
    return '<svg viewBox="-12 -12 24 24" width="' + size + '" height="' + size + '" shape-rendering="auto">' +
             '<circle cx="0" cy="0" r="' + r + '" fill="' + color + '" stroke="var(--colorMarkerStroke)" stroke-width="2"/>' +
           '</svg>';
  }

  function uuid4() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (char) {
      var rand = Math.random() * 16 | 0;
      var value = char === 'x' ? rand : (rand & 0x3 | 0x8);
      return value.toString(16);
    });
  }
  function isInsidePeru(lat, lon) {
    var b = CONFIG.BBOX_MODE === 'peruSolo' ? CONFIG.PERU_BBOX : CONFIG.PERU_COLOMBIA_BBOX;
    return lat >= b.latMin && lat <= b.latMax && lon >= b.lonMin && lon <= b.lonMax;
  }

  // ============================================================
  // OWNERSHIP ZONE · Mapa & Persistencia (Ag. A) · GEOMETRY HELPERS
  // Heredados literalmente del padre v00; segmentsIntersect + polygonHasSelfIntersection
  // ELIMINADAS (restricción §5 spec). polygonAreaHa + polygonPerimeterMeters también
  // eliminadas (track no tiene área).
  // ============================================================
  function haversineMeters(p1, p2) {
    var R = 6371000;
    var toRad = function (d) { return d * Math.PI / 180; };
    var dLat = toRad(p2[1] - p1[1]);
    var dLon = toRad(p2[0] - p1[0]);
    var a = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(toRad(p1[1])) * Math.cos(toRad(p2[1])) * Math.pow(Math.sin(dLon / 2), 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function bearingDegrees(p1, p2) {
    var toRad = function (d) { return d * Math.PI / 180; };
    var toDeg = function (r) { return r * 180 / Math.PI; };
    var lat1 = toRad(p1[1]), lat2 = toRad(p2[1]);
    var dLon = toRad(p2[0] - p1[0]);
    var y = Math.sin(dLon) * Math.cos(lat2);
    var x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }
  // Mapeo accuracy → nivel UI con etiqueta y clase de color (heredado del padre).
  function accuracyToLevel(acc) {
    if (acc == null || !isFinite(acc) || acc <= 0) return { level: 0, label: 'Sin señal', cls: 'bad' };
    if (acc < 5)   return { level: 4, label: 'Excelente', cls: 'good' };
    if (acc < 15)  return { level: 3, label: 'Bueno',     cls: 'good' };
    if (acc < 50)  return { level: 2, label: 'Aceptable', cls: 'warn' };
    if (acc < 200) return { level: 1, label: 'Pobre',     cls: 'bad'  };
    return { level: 0, label: 'Sin señal', cls: 'bad' };
  }

  // ============================================================
  // OWNERSHIP ZONE · Mapa & Persistencia (Ag. A) · INDEXEDDB
  // DB renombrada: 'moontrip-tracker-v1'. Store 'tracks' (no 'poligonos').
  // Migración no destructiva desde DB legacy del padre 'geoplacer-recorder.poligonos'
  // (RD-05 + T-04). Records con mode==='walk' && points.length>=2 se copian con
  // pointTimestamps array de null por vértice. Marker de migración persistido para
  // no repetir.
  // ============================================================
  var DB_NAME = 'moontrip-tracker-v1';
  var DB_VERSION = 1;
  var DB_LEGACY_NAME = 'geoplacer-recorder';
  var MIGRATION_MARKER_UUID = '__migration_legacy_marker__';
  var _db = null;

  function openDB() {
    return new Promise(function (resolve, reject) {
      if (_db) return resolve(_db);
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return; settled = true;
        reject(new Error('IndexedDB no respondió en 6 segundos. Esto suele pasar cuando se abre el archivo HTML directamente desde el celular (URL file://). Se necesita servir el archivo desde https:// para funcionar.'));
      }, 6000);
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) {
        settled = true; clearTimeout(timer);
        return reject(new Error('IndexedDB no disponible en este navegador: ' + (e.message || e)));
      }
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('tracks')) db.createObjectStore('tracks', { keyPath: 'uuid' });
        if (!db.objectStoreNames.contains('tiles')) db.createObjectStore('tiles');
      };
      req.onsuccess = function () {
        if (settled) return;
        _db = req.result;
        migrateFromLegacyIfNeeded(_db).then(function () {
          settled = true; clearTimeout(timer);
          resolve(_db);
        }).catch(function () {
          settled = true; clearTimeout(timer);
          resolve(_db);
        });
      };
      req.onerror = function () {
        if (settled) return; settled = true; clearTimeout(timer);
        reject(req.error || new Error('Error abriendo IndexedDB'));
      };
      req.onblocked = function () {
        if (settled) return; settled = true; clearTimeout(timer);
        reject(new Error('IndexedDB bloqueada por otra pestaña abierta.'));
      };
    });
  }

  // Migración no destructiva: lee 'poligonos' del padre legacy, copia walks con
  // pointTimestamps=null. NO elimina ni modifica el padre. Persiste marker para
  // no repetir entre sesiones (RD-05).
  function migrateFromLegacyIfNeeded(targetDb) {
    return new Promise(function (resolve) {
      try {
        var checkTx = targetDb.transaction('tracks', 'readonly').objectStore('tracks').get(MIGRATION_MARKER_UUID);
        checkTx.onsuccess = function () {
          if (checkTx.result) return resolve(false);
          // Marker ausente: contar tracks. Si ya hay datos, marcar y salir.
          var countTx = targetDb.transaction('tracks', 'readonly').objectStore('tracks').count();
          countTx.onsuccess = function () {
            if (countTx.result > 0) {
              var wTx = targetDb.transaction('tracks', 'readwrite');
              wTx.objectStore('tracks').put({ uuid: MIGRATION_MARKER_UUID, _marker: true, ts: Date.now() });
              wTx.oncomplete = function () { resolve(false); };
              wTx.onerror = function () { resolve(false); };
              return;
            }
            // Sin tracks → intentar copia desde legacy
            var legacyReq = indexedDB.open(DB_LEGACY_NAME);
            legacyReq.onerror = function () { resolve(false); };
            legacyReq.onsuccess = function () {
              var legacyDb = legacyReq.result;
              if (!legacyDb.objectStoreNames.contains('poligonos')) { legacyDb.close(); return resolve(false); }
              var ltx = legacyDb.transaction('poligonos', 'readonly').objectStore('poligonos').getAll();
              ltx.onsuccess = function () {
                var rows = ltx.result || [];
                var walks = rows.filter(function (r) { return r && r.mode === 'walk' && r.points && r.points.length >= 2; });
                var wtx = targetDb.transaction('tracks', 'readwrite');
                var store = wtx.objectStore('tracks');
                walks.forEach(function (r) {
                  try {
                    var migrated = {
                      uuid: r.uuid,
                      name: r.name,
                      mode: 'walk',
                      points: r.points.map(function (p) {
                        return [p[0], p[1], (p.length >= 3 ? p[2] : null), null];
                      }),
                      createdAt: r.createdAt,
                      migrated: true,
                      legacyTimestampsNull: true
                    };
                    store.put(migrated);
                  } catch (_) {}
                });
                store.put({ uuid: MIGRATION_MARKER_UUID, _marker: true, ts: Date.now(), migratedCount: walks.length });
                wtx.oncomplete = function () { legacyDb.close(); console.info('moonTripTracker · migrados ' + walks.length + ' tracks desde DB legacy.'); resolve(true); };
                wtx.onerror = function () { legacyDb.close(); resolve(false); };
              };
              ltx.onerror = function () { legacyDb.close(); resolve(false); };
            };
          };
          countTx.onerror = function () { resolve(false); };
        };
        checkTx.onerror = function () { resolve(false); };
      } catch (_) { resolve(false); }
    });
  }

  function dbGet(store, key) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readonly').objectStore(store).get(key);
        tx.onsuccess = function () { res(tx.result || null); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbAll(store) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readonly').objectStore(store).getAll();
        tx.onsuccess = function () { res(tx.result || []); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbPut(store, val) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readwrite').objectStore(store).put(val);
        tx.onsuccess = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbDel(store, key) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readwrite').objectStore(store).delete(key);
        tx.onsuccess = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbPutKeyed(store, val, key) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readwrite').objectStore(store).put(val, key);
        tx.onsuccess = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbCount(store) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(store, 'readonly').objectStore(store).count();
        tx.onsuccess = function () { res(tx.result || 0); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }

  // ============================================================
  // OWNERSHIP ZONE · Mapa & Persistencia (Ag. A) · EXPORT HELPERS
  // buildGeoJson reescrita: produce Feature LineString (no Polygon). NO cierra el
  // ring. Properties: name, mode, createdAt, velocidadPromedioMps, velocidadMaxMps,
  // velocidadMinMps, pointAccuracies, pointQualities, pointTimestamps (RD-08 + RD-09).
  // En modo trace los 3 campos de velocidad se fuerzan a null (RD-09).
  // ============================================================
  function buildGeoJson(record) {
    if (!record.points || record.points.length < 2) return null;
    var src = record.points;
    var coords = src.map(function (p) { return [p[0], p[1]]; });
    var accs = src.map(function (p) { return (p.length >= 3 && p[2] != null) ? +(+p[2]).toFixed(1) : null; });
    var qualities = src.map(function (p) {
      var acc = (p.length >= 3) ? p[2] : null;
      return accuracyToQualityLabel(acc);
    });
    var timestamps = src.map(function (p) { return (p.length >= 4 && p[3] != null) ? p[3] : null; });

    var velocities = { promedio: null, max: null, min: null };
    if ((record.mode || 'walk') === 'walk') {
      velocities = calcularVelocidadesAgregadas(src);
    }

    return {
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        properties: {
          name: record.name,
          mode: record.mode || 'walk',
          createdAt: new Date(record.createdAt).toISOString(),
          velocidadPromedioMps: velocities.promedio,
          velocidadMaxMps: velocities.max,
          velocidadMinMps: velocities.min,
          pointAccuracies: accs,
          pointQualities: qualities,
          pointTimestamps: timestamps
        },
        geometry: { type: 'LineString', coordinates: coords }
      }]
    };
  }

  // §3.3 spec · cálculo de velocidades agregadas en m/s sobre array de vértices
  // [lon, lat, acc, ts]. Omite dt<=0 silenciosamente. Si array de instantáneas
  // queda vacío, retorna {promedio:null, max:null, min:null}.
  function calcularVelocidadesAgregadas(points) {
    if (!points || points.length < 2) return { promedio: null, max: null, min: null };
    var instantaneas = [];
    var haversineTotal = 0;
    for (var i = 1; i < points.length; i++) {
      var d_i = haversineMeters([points[i - 1][0], points[i - 1][1]], [points[i][0], points[i][1]]);
      haversineTotal += d_i;
      var ts1 = points[i - 1][3], ts2 = points[i][3];
      if (ts1 == null || ts2 == null) continue;
      var dt_i = (ts2 - ts1) / 1000;
      if (dt_i <= 0) continue;
      instantaneas.push(d_i / dt_i);
    }
    if (instantaneas.length === 0) {
      console.warn('moonTripTracker · sin timestamps válidos, velocidades = null');
      return { promedio: null, max: null, min: null };
    }
    var ts0 = points[0][3], tsN = points[points.length - 1][3];
    var promedio = null;
    if (ts0 != null && tsN != null && (tsN - ts0) > 0) {
      promedio = haversineTotal / ((tsN - ts0) / 1000);
    }
    var max = instantaneas[0], min = instantaneas[0];
    for (var k = 1; k < instantaneas.length; k++) {
      if (instantaneas[k] > max) max = instantaneas[k];
      if (instantaneas[k] < min) min = instantaneas[k];
    }
    return { promedio: promedio, max: max, min: min };
  }

  function downloadBlob(filename, content, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    document.body.removeChild(anchor);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function slugify(s) {
    return (s || '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-zA-Z0-9._-]+/g, '_')
      .replace(/^_+|_+$/g, '') || 'track';
  }

  function exportTrack(uuid) {
    var r = state.tracks.find(function (x) { return x.uuid === uuid; });
    if (!r) return;
    var geo = buildGeoJson(r);
    if (!geo) { toast(t('toastNoLocate')); return; }
    var fname = slugify(r.name) + '.geojson';
    downloadBlob(fname, JSON.stringify(geo, null, 2), 'application/geo+json');
    toast(t('toastGeoJsonOk'));
  }
  function exportAll() {
    if (!state.tracks.length) return;
    var n = 0, i = 0;
    function next() {
      if (i >= state.tracks.length) { toast(t('toastExportAllOk')(n)); return; }
      var r = state.tracks[i++];
      var geo = buildGeoJson(r);
      if (geo) {
        downloadBlob(slugify(r.name) + '.geojson', JSON.stringify(geo, null, 2), 'application/geo+json');
        n++;
      }
      setTimeout(next, 200);
    }
    next();
  }
  function deleteTrack(uuid) {
    var r = state.tracks.find(function (x) { return x.uuid === uuid; });
    if (!r) return;
    confirmDialog({
      title: t('confirmDeleteTitle'),
      message: t('confirmDeleteMsg')('<b>' + (r.name || '?') + '</b>'),
      confirm: t('confirmDelYes'),
      cancel: t('confirmDelNo'),
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      dbDel('tracks', uuid).then(function () {
        state.tracks = state.tracks.filter(function (x) { return x.uuid !== uuid; });
        render();
        toast(t('toastTrackDeleted'));
      });
    });
  }
